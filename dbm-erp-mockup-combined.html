<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT Distriversa Buanamas — ERP Mockup</title>
<style>
:root{
  --navy:#2b3358;
  --navy-2:#232a49;
  --blue:#4472c4;
  --blue-light:#29b6f6;
  --bg:#eef1f7;
  --card-bg:#ffffff;
  --text:#33384a;
  --text-light:#8a90a3;
  --border:#e3e6ee;
  --red:#ef4b62;
  --teal:#17c3c3;
  --yellow:#f0b429;
  --green:#27ae60;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
a{color:inherit;text-decoration:none;}

/* ===== Topbar ===== */
.topbar{height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:50;}
.topbar .left{display:flex;align-items:center;gap:14px;}
.hamburger{cursor:pointer;opacity:.85;display:flex;}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;}
.brand .logo-badge{width:30px;height:30px;border-radius:7px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.brand .full-name{font-size:14px;font-weight:600;}
.brand .full-name small{display:block;font-size:10.5px;font-weight:400;color:#b9c0d6;letter-spacing:.03em;}
.topbar-right{display:flex;align-items:center;gap:22px;font-size:13px;}
.icon-wrap{position:relative;cursor:pointer;opacity:.9;display:flex;}
.badge{position:absolute;top:-7px;right:-9px;background:var(--red);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;line-height:1.3;}
.user-greet{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.user-greet .uname{font-weight:600;}
.user-greet .udemo{color:#a9b0c8;font-size:11.5px;}

/* ===== Layout ===== */
.layout{display:flex;min-height:calc(100vh - 56px);}
.sidebar{width:275px;background:#fff;border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;transition:width .15s,opacity .1s;}
.sidebar-scroll{overflow-y:auto;flex:1;padding-bottom:6px;}
.layout.collapsed .sidebar{width:0;opacity:0;overflow:hidden;border:none;}

.menu-top{display:flex;align-items:center;gap:11px;padding:11px 18px;cursor:pointer;color:#4a5170;font-size:13.5px;border-left:3px solid transparent;user-select:none;}
.menu-top svg{flex-shrink:0;opacity:.85;}
.menu-top:hover{background:#f4f6fb;}
.menu-top.active-parent{background:var(--navy);color:#fff;border-left-color:var(--blue-light);}
.menu-top.active-parent svg{opacity:1;}
.menu-top .chev{margin-left:auto;font-size:10px;transition:transform .15s;opacity:.7;}
.menu-top.open .chev{transform:rotate(90deg);}
.menu-top.leaf.current{background:#eef3fb;color:var(--blue);border-left-color:var(--blue);}

.submenu{display:none;padding:2px 0 10px 0;background:#fafbfd;}
.submenu.open{display:block;}
.submenu-header{font-size:10.5px;font-weight:700;color:#a7adbd;text-transform:uppercase;padding:12px 18px 5px 45px;letter-spacing:.04em;}
.submenu-item{display:flex;align-items:center;gap:9px;padding:6.5px 18px 6.5px 45px;font-size:12.8px;color:#5b6178;cursor:pointer;}
.submenu-item:hover{background:#eef1f9;color:var(--blue);}
.submenu-item.current{color:var(--blue);font-weight:600;background:#e9f0fb;}
.submenu-item .dot{width:6px;height:6px;border-radius:50%;border:1.6px solid #b7bccb;flex-shrink:0;}
.submenu-item.current .dot{border-color:var(--blue);background:var(--blue);}

.sidebar-footer{padding:12px 18px;border-top:1px solid var(--border);font-size:10.5px;color:#a7adbd;line-height:1.5;}

/* ===== Content ===== */
.content{flex:1;padding:20px;overflow-x:hidden;min-width:0;}
.breadcrumb{font-size:12px;color:var(--text-light);margin-bottom:12px;}
.breadcrumb b{color:var(--text);font-weight:600;}

.kpi-row{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.kpi-card{flex:1;min-width:225px;border-radius:9px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:74px;}
.kpi-card .kpi-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;opacity:.28;}
.kpi-card .kpi-icon svg{width:34px;height:34px;}
.kpi-card .kpi-value{font-size:25px;font-weight:700;text-align:right;}
.kpi-card .kpi-label{font-size:12.5px;text-align:right;opacity:.95;}
.kpi-red{background:var(--red);} .kpi-teal{background:var(--teal);} .kpi-yellow{background:var(--yellow);} .kpi-green{background:var(--green);}

.card{background:var(--card-bg);border-radius:9px;box-shadow:0 1px 3px rgba(20,20,50,.07);margin-bottom:18px;overflow:hidden;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
.card-header h3{font-size:14.5px;font-weight:700;}
.card-header .sub{font-size:11px;color:var(--text-light);font-weight:400;margin-left:6px;}
.card-body{padding:18px;}
.dark-header{background:var(--navy);color:#fff;}
.dark-header h3{color:#fff;display:flex;align-items:center;gap:8px;}
.chip{background:var(--blue-light);color:#0b3a4d;font-size:11.5px;padding:4px 12px;border-radius:14px;font-weight:600;white-space:nowrap;}
.refresh-ic{opacity:.6;cursor:pointer;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-2>.card{min-width:0;}
@media (max-width:1150px){.grid-2{grid-template-columns:1fr;}}

.flow-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.flow-step{display:flex;flex-direction:column;align-items:center;gap:9px;}
.flow-box{width:86px;height:86px;background:var(--navy-2);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;}
.flow-box svg{width:28px;height:28px;}
.flow-label{font-size:11.8px;font-weight:600;text-align:center;max-width:100px;line-height:1.25;}
.flow-arrow{color:#c1c6d6;font-size:20px;}
.flow-extra{margin-left:110px;margin-top:14px;}
.quick-links{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap;}
.quick-link{flex:1;min-width:150px;background:var(--blue);color:#fff;border-radius:9px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;transition:background .15s;}
.quick-link svg{width:22px;height:22px;}
.quick-link:hover{background:#3a63ac;}

/* Branching flow diagram (grid-based, e.g. Purchase Transaction Flow) */
.flow-grid{display:grid;grid-template-columns:96px 40px 96px 40px 96px 40px 96px;row-gap:24px;align-items:start;overflow-x:auto;padding-bottom:4px;}
.flow-grid .flow-arrow{display:flex;align-items:center;justify-content:center;height:86px;}
.flow-box.quick{background:var(--blue);cursor:pointer;transition:background .15s;}
.flow-box.quick:hover{background:#3a63ac;}

/* Average cycle timeline */
.cycle-row{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:10px 6px 4px;gap:6px;}
.cycle-row::before{content:'';position:absolute;left:34px;right:34px;top:29px;height:2px;background:var(--border);z-index:0;}
.cycle-node{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12px;color:var(--blue);position:relative;z-index:1;max-width:110px;text-align:center;}
.cycle-node .dot{width:12px;height:12px;border-radius:50%;background:#27ae60;border:3px solid #fff;box-shadow:0 0 0 1.5px #27ae60;margin-top:23px;}
.cycle-mid{width:58px;height:58px;border-radius:50%;background:#eef1f7;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;color:var(--text);position:relative;z-index:1;flex-shrink:0;}

/* Scrollable table body for dashboard widgets */
.scroll-table{max-height:320px;overflow-y:auto;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600;white-space:nowrap;}
tbody td{padding:8px 12px;border-bottom:1px solid var(--border);color:#454b5f;white-space:nowrap;}
tbody tr:hover{background:#f7f9fd;}
.text-right{text-align:right;}
.table-wrap{overflow-x:auto;}
.table-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:10px;flex-wrap:wrap;}
.table-toolbar select,.table-toolbar input{border:1px solid var(--border);border-radius:5px;padding:6px 10px;font-size:12.8px;}
.table-toolbar input{min-width:230px;}
.table-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:12px;color:var(--text-light);flex-wrap:wrap;gap:8px;}
.pager button{border:1px solid var(--border);background:#fff;padding:5px 10px;margin-right:4px;border-radius:4px;font-size:12px;cursor:pointer;color:var(--text);}
.pager button.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.status-pill{padding:2.5px 10px;border-radius:12px;font-size:11px;font-weight:600;display:inline-block;}
.status-paid{background:#e3f8ec;color:#1a9c53;}
.status-open{background:#eef1f7;color:#7b8194;}
.status-overdue{background:#fdeaec;color:#e0405b;}
.status-aktif{background:#e3f8ec;color:#1a9c53;}
.status-nonaktif{background:#fdeaec;color:#e0405b;}

.placeholder-box{border:1.6px dashed var(--border);border-radius:9px;padding:60px 20px;text-align:center;color:var(--text-light);}
.placeholder-box .pico{margin-bottom:14px;display:flex;justify-content:center;opacity:.5;}
.placeholder-box .pico svg{width:46px;height:46px;}
.placeholder-box p{max-width:420px;margin:6px auto 0;font-size:13px;line-height:1.6;}

.btn-primary{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:12.8px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn-primary:hover{background:#3a63ac;}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.page-head h2{font-size:18.5px;}
canvas{max-width:100%;}
.footer-note{text-align:center;font-size:11px;color:var(--text-light);padding:18px 0 6px;}

.profile-grid{display:grid;grid-template-columns:180px 1fr;row-gap:14px;column-gap:16px;max-width:640px;}
.profile-grid dt{color:var(--text-light);font-size:12.8px;}
.profile-grid dd{font-weight:600;font-size:13.5px;}
.report-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.report-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;}
.report-item:hover{border-color:var(--blue);}
.report-item .ric{width:38px;height:38px;border-radius:8px;background:#eaf1fb;color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.report-item .ric svg{width:19px;height:19px;}
.report-item .rtitle{font-size:12.8px;font-weight:600;}

/* ===== Icon buttons (tabel Ubah/Hapus) ===== */
.icon-btn{width:30px;height:30px;border-radius:5px;border:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
.icon-btn svg{width:15px;height:15px;}
.icon-btn.edit{background:var(--blue);}
.icon-btn.edit:hover{background:#3a63ac;}
.icon-btn.del{background:var(--red);}
.icon-btn.del:hover{background:#d63c52;}
.gl-account-header td{background:#eaf1fb;font-weight:700;color:var(--navy);}
.btn-secondary{background:#eef1f7;color:var(--text);border:none;padding:9px 16px;border-radius:6px;font-size:12.8px;font-weight:600;cursor:pointer;}
.btn-secondary:hover{background:#e3e6ee;}
.btn-danger{background:var(--red);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:12.8px;font-weight:600;cursor:pointer;}
.btn-danger:hover{background:#d63c52;}
.btn-teal{background:var(--blue-light);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:12.8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-teal:hover{background:#1ba0c9;}
.btn-warning{background:var(--yellow);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:12.8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-warning:hover{background:#d99a1f;}

/* ===== Toggle switch (dipakai di list Jurnal Pembelian: Konsinyasi?/Non Aktif?) ===== */
.toggle-switch{position:relative;display:inline-block;width:40px;height:22px;vertical-align:middle;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#ccced8;border-radius:22px;cursor:pointer;transition:.15s;}
.toggle-slider:before{content:'';position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.toggle-switch input:checked + .toggle-slider{background:var(--blue);}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(18px);}

/* ===== Alert banner (Jurnal Pembelian: peringatan jurnal sudah dipakai) ===== */
.alert-warning{background:#fdf1cf;color:#6b5215;border:1px solid #f3ddA0;border-radius:7px;padding:12px 16px;font-size:12.8px;font-weight:600;margin-bottom:16px;}

/* ===== Field table (Jurnal Pembelian: Nama Jurnal/Mata Uang/Cabang) ===== */
.field-table{width:100%;border-collapse:collapse;margin-bottom:16px;border:1px solid var(--border);}
.field-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.8px;}
.field-table tr:last-child td{border-bottom:none;}
.field-table td.flabel{background:#f7f8fb;font-weight:600;color:var(--text);width:160px;white-space:nowrap;}
.field-table td input,.field-table td select{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12.8px;font-family:inherit;}
.field-table td input:disabled,.field-table td input[readonly]{background:#f4f6fb;color:var(--text-light);}
/* Checkbox di dalam .field-table (dipakai Gudang: Default/Gudang Transit/
   Near ED/Reject/Gudang Cadangan/Konsinyasi) TIDAK boleh ikut width:100%
   seperti input teks/select di atas — kalau ikut, layout-nya (bukan
   tampilan visualnya) jadi selebar kolom, mendorong elemen sebaris
   sesudahnya (misal label+input "Hari Peringatan") keluar dari batas
   card. Override width:auto khusus untuk type=checkbox. */
.field-table td input[type=checkbox]{width:auto;vertical-align:middle;}

/* ===== Akun table (Jurnal Pembelian: baris akun label + input+cari+hapus + nama akun) ===== */
.jp-akun-table{width:100%;border-collapse:collapse;border:1px solid var(--border);margin-bottom:18px;}
.jp-akun-table td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.8px;}
.jp-akun-table tr:last-child td{border-bottom:none;}
.jp-akun-table td.jp-label{font-weight:600;color:var(--text);width:230px;}
.jp-akun-table td.jp-input{width:220px;}
.jp-akun-table td.jp-input .input-with-btn input{width:90px;}
.jp-akun-table td.jp-nama{color:var(--blue);}
.jp-section-title{font-weight:700;font-size:13.5px;color:var(--text);margin:6px 0 10px;}

/* ===== Modal (Tambah/Ubah/Hapus) ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,40,.45);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal-box{background:#fff;border-radius:9px;width:100%;max-width:420px;margin:0 16px;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;}
.modal-header{background:var(--navy);color:#fff;padding:14px 18px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.modal-header .close{cursor:pointer;opacity:.8;font-size:20px;line-height:1;}
.modal-header .close:hover{opacity:1;}
.modal-body{padding:20px 18px;}
.modal-body p{font-size:13px;line-height:1.6;color:var(--text);}
.modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12.5px;color:var(--text-light);margin-bottom:6px;font-weight:600;}
.form-group input{width:100%;border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:13px;font-family:inherit;}
.form-group input:focus{outline:none;border-color:var(--blue);}
.form-error{display:none;color:var(--red);font-size:11.5px;margin-top:5px;}
.form-group input:disabled,.form-group input[readonly]{background:#f4f6fb;color:var(--text-light);}
.link-add{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--blue);font-weight:600;margin-top:8px;text-decoration:none;}
.link-add:hover{text-decoration:underline;}
.btn-pick{padding:4px 12px;font-size:12px;}
/* Teks biru klik-untuk-pilih di dalam tabel picker (dipakai popup
   "Daftar Persediaan" bersama — Kode Barang/Nama Barang, lihat
   openPersediaanPicker() di core.js, sejak 2026-08-12 lanjutan lagi) */
.link-pick{background:none;border:none;padding:0;font:inherit;color:var(--blue);font-weight:600;cursor:pointer;text-align:left;}
.link-pick:hover{text-decoration:underline;}
.modal-body .table-wrap{margin-top:4px;}
.modal-body .table-wrap table th,.modal-body .table-wrap table td{padding:8px 10px;font-size:12.5px;}
.page-loading{padding:60px 0;text-align:center;color:var(--text-light);font-size:13px;}

/* ===== Form tambahan (select/textarea, grid 2 kolom, radio, checkbox) ===== */
.form-group select,.form-group textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff;}
.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--blue);}
.form-group textarea{resize:vertical;min-height:64px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;}
@media (max-width:900px){.form-grid{grid-template-columns:1fr;}}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;column-gap:14px;}
@media (max-width:900px){.form-grid-3{grid-template-columns:1fr 1fr;}}
.form-section{margin:22px 0 14px;padding-top:16px;border-top:1px solid var(--border);font-size:13.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;}
.field-pair{display:flex;gap:10px;}
.field-pair>div{flex:1;}
.field-pair select{width:auto;min-width:90px;}
.input-with-btn{display:flex;gap:8px;}
.input-with-btn input{flex:1;}
.radio-inline{display:flex;gap:20px;align-items:center;padding-top:6px;}
.radio-inline label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:13px;color:var(--text);cursor:pointer;}
.radio-inline input{width:auto;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:12px 0;}
.checkbox-row label{font-weight:400;font-size:13px;color:var(--text);cursor:pointer;}
.checkbox-row input{width:auto;}
.form-page-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);}
.btn-outline{background:#fff;color:var(--blue);border:1px solid var(--blue);padding:8px 14px;border-radius:6px;font-size:12.3px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-outline:hover{background:#eaf1fb;}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.form-group input.readonly-cell,.form-group select.readonly-cell{background:#f4f6fb;color:var(--text-light);}

/* ===== Icon buttons tambahan (Stock Request: Lihat/Cetak) ===== */
.icon-btn.view{background:var(--navy-2);}
.icon-btn.view:hover{background:#171c33;}
.icon-btn.print{background:var(--teal);}
.icon-btn.print:hover{background:#12a3a3;}

/* ===== Status text (Stock Request: OPEN/CLOSED) ===== */
.st-open{color:var(--green);font-weight:700;}
.st-closed{color:var(--red);font-weight:700;}

/* ===== Group collapsible (Stock Request: Rincian per kategori) ===== */
.sr-group-block{border:1px solid var(--border);border-radius:7px;margin-bottom:16px;overflow:hidden;}
.sr-group-bar{display:flex;justify-content:space-between;align-items:center;background:#fbebea;color:#c0392b;font-weight:700;font-size:13px;padding:10px 14px;cursor:pointer;user-select:none;}
.sr-group-bar .chev{transition:transform .15s;display:flex;}
.sr-group-bar.open .chev{transform:rotate(180deg);}
.sr-group-body{display:none;}
.sr-group-body.open{display:block;}
.sr-detail-table{width:100%;border-collapse:collapse;}
.sr-detail-table th{background:#f7f8fb;color:var(--text);font-weight:700;text-align:left;padding:8px 12px;font-size:12px;border-bottom:1px solid var(--border);}
.sr-detail-table td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.8px;}
.sr-detail-table tr:last-child td{border-bottom:none;}
.sr-detail-table input[type="number"]{width:90px;border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:12.8px;}
.sr-detail-table input[type="number"]:disabled{background:#f4f6fb;color:var(--text-light);}
.sr-detail-table input[type="checkbox"]{width:16px;height:16px;cursor:pointer;}

/* ===== Chip button (Stock Request: filter periode di list) ===== */
.chip-btn{background:var(--blue-light);color:#fff;border:none;font-size:12px;padding:7px 14px;border-radius:6px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.chip-btn:hover{background:#1ba0c9;}

/* ===== Purchase Order: grid 3 kolom, tombol cetak kecil di list,
   tabel rincian barang (banyak kolom kalkulasi), radio vertikal,
   kotak upload dekoratif ===== */
.po-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:20px;}
@media (max-width:900px){.po-grid-3{grid-template-columns:1fr;}}
.po-grid-3 .form-group{margin-bottom:14px;}

.cetak-btn{background:var(--blue-light);color:#fff;border:none;padding:4px 10px;border-radius:5px;font-size:10.8px;font-weight:600;cursor:pointer;margin-top:4px;}
.cetak-btn:hover{background:#1ba0c9;}

.radio-group{display:flex;flex-direction:column;gap:10px;}
.radio-group label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;font-weight:400;}
.radio-group input{width:auto;}

.upload-box{border:1px solid var(--border);border-radius:6px;min-height:64px;overflow-y:auto;padding:6px 10px;font-size:12px;color:var(--text-light);background:#f9fafc;}

.po-textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12.8px;font-family:inherit;resize:vertical;}

.po-item-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.po-item-table th{background:#f7f8fb;color:var(--text);font-weight:700;text-align:left;padding:8px 10px;font-size:11.2px;border-bottom:1px solid var(--border);white-space:nowrap;}
.po-item-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.po-item-table input,.po-item-table select{width:100%;border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:12px;font-family:inherit;}
.po-item-table input[type="number"]{text-align:right;}
.po-item-table input:disabled,.po-item-table textarea:disabled{background:#f4f6fb;color:var(--text-light);}
.po-item-table textarea{width:100%;border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:12px;resize:vertical;min-height:34px;font-family:inherit;}
.po-item-table input[type="checkbox"]{width:16px;height:16px;}
.po-rincian-table td:nth-child(2),.po-rincian-table td:nth-child(4){min-width:120px;}

/* ===== Picking List: tag input multi-value (field "Picker"), satu-satunya
   komponen CSS BENAR-BENAR baru untuk modul ini — semua yang lain reuse
   .field-table/.field-pair/.input-with-btn/.link-add/.btn-pick/.chip-btn/
   .po-item-table/.icon-btn/.form-page-actions yang sudah ada. Warna chip
   pakai var(--blue-light) (bukan warna baru) supaya konsisten dengan
   .chip-btn yang sudah ada di list Stock Request/Purchase Order/Sales
   Order. ===== */
.tag-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:38px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;}
.tag-chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-light);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:14px;}
.tag-chip .rm{cursor:pointer;font-weight:700;}

/* ===== Picking List: kolom aksi "Checked" — teal, class TERPISAH dari
   .icon-btn.print (walau warnanya sama, var(--teal)) supaya semantiknya
   jelas beda aksi (Checked vs Cetak) di markup/kode, bukan reuse literal
   class yang sama. ===== */
.icon-btn.check{background:var(--teal);}
.icon-btn.check:hover{background:#12a3a3;}

/* ===== Invoice: tombol Ubah/Hapus/Posting yang di-disable permanen
   setelah Invoice di-posting (transisi satu arah, lihat komentar
   openInvPostingConfirm() di js/pages/invoice.js) — gap CSS genuinely
   baru, belum ada treatment "disabled" utk .icon-btn di modul manapun
   sebelumnya (Picking List/Sales Order pakai disabled HANYA di
   input/select, bukan tombol icon). ===== */
.icon-btn.disabled,.icon-btn[disabled]{opacity:.4;pointer-events:none;cursor:not-allowed;}

/* ===== Invoice: tab switcher "Detail Transaksi" / "Rincian Jurnal Akun"
   — komponen UI baru, belum ada modul lain di mockup ini yang butuh
   tab. Dibuat minimal (2 tombol toggle underline biru), tanpa animasi. ===== */
.inv-tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:1px solid var(--border);}
.inv-tab-btn{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.inv-tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}

</style>
</head>
<body>
<div class="topbar">
  <div class="left">
    <span class="hamburger" id="hamburgerBtn"></span>
    <div class="brand">
      <div class="logo-badge">DBM</div>
      <div class="full-name">Distriversa Buanamas<small>ERP SYSTEM — MOCKUP</small></div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="icon-wrap" title="Notifikasi"><span class="badge">5</span></span>
    <span class="icon-wrap" title="Keamanan"></span>
    <div class="user-greet">
      <span>Halo, <span class="uname">Sidik</span></span>
      <span class="udemo">(MOCKUP DBM-2026)</span>
    </div>
  </div>
</div>

<div class="layout" id="layout">
  <aside class="sidebar">
    <div class="sidebar-scroll" id="sidebarScroll"></div>
    <div class="sidebar-footer">
      (ver. mockup.1.0) &copy; Distriversa Buanamas<br>
      Licensed to: PT Distriversa Buanamas
    </div>
  </aside>
  <main class="content" id="content"></main>
</div>

/* ===== Helper murni tanggal (belum ada helper generik serupa di
   modul lain — dibuat lokal di sini, dipakai bersama oleh template &
   logic). Format tanggal di seluruh mockup ini selalu string "DD/MM/YYYY". ===== */
function fktParseTglID(str){
  if(!str) return null;
  const parts = String(str).split('/');
  if(parts.length !== 3) return null;
  const d = +parts[0], m = +parts[1], y = +parts[2];
  if(!d || !m || !y) return null;
  return new Date(y, m - 1, d);
}
function fktFormatTglID(date){
  const d = String(date.getDate()).padStart(2, '0');
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const y = date.getFullYear();
  return `${d}/${m}/${y}`;
}
/* Tgl. Jth. Tempo = Tgl. Faktur + N hari kredit dari Syarat Bayar
   ("Kredit N Hari" -> +N hari; "CBD" -> 0 hari/hari yang sama) —
   dipakai form Tambah tiap kali Tgl. Faktur atau Syarat Bayar
   berubah (lihat komentar DATA.fakturPenjualanSJ di js/data.js,
   angka N-hari ini yang dipakai menghitung manual seluruh 8 baris
   sample lewat Node sekali supaya konsisten dengan helper ini). */
function fktJatuhTempo(tglFaktur, syaratBayar){
  const dt = fktParseTglID(tglFaktur);
  if(!dt) return '';
  const match = /Kredit\s+(\d+)\s+Hari/i.exec(syaratBayar || '');
  const hari = match ? (+match[1]) : 0;
  dt.setDate(dt.getDate() + hari);
  return fktFormatTglID(dt);
}

/* Status ditampilkan sebagai teks berwarna (bukan pill), mengikuti pola
   .st-open/.st-closed di Stock Request. Pemilihan warna (keputusan
   desain, screenshot asli tidak bisa dipastikan warnanya persis):
   - "Waiting Request Packing" -> teal (reuse var(--teal), warna aksen
     yang sudah dipakai di .icon-btn.print/.chip-btn) — merepresentasikan
     "masih dalam antrian/proses", bukan warning/error.
   - "Terkirim" -> hijau (reuse .st-open) — status akhir yang sukses,
     konsisten dengan konvensi warna hijau=selesai/aktif/paid di seluruh
     mockup ini (fmtCell 'selesai'/'paid'/'aktif' -> hijau). */
function tplPklStatusText(status){
  if(status === 'Terkirim') return `<span class="st-open">${status}</span>`;
  return `<span style="color:var(--teal);font-weight:700;">${status}</span>`;
}

function tplPklCheckedBtn(row, i){
  if(row.status === 'Waiting Request Packing'){
    return `<button class="icon-btn check" data-checked="${i}" title="Checked">${icon('check',15)}</button>`;
  }
  return `<button class="icon-btn del" data-revert="${i}" title="Batalkan Terkirim">${icon('trash',15)}</button>`;
}

function tplPklRows(rows){
  if(!rows.length) return `<tr><td colspan="9" style="color:var(--text-light);">Tidak ada data Picking List</td></tr>`;
  return rows.map((r,i)=>`
    <tr>
      <td><b style="color:var(--blue);">${r.no}</b><br><span style="font-size:11px;color:var(--text-light);">${r.tglBuat||''}</span></td>
      <td><b>${r.customerNama||''}</b><br><span style="font-size:11px;color:var(--text-light);">${r.customerKode||''} &amp;</span><br><span style="font-size:11.5px;color:var(--text-light);">${r.customerAlamat||''}</span></td>

      <td>${tplPklStatusText(r.status)}</td>

      <td>${tplPklCheckedBtn(r, i)}</td>

      <td><button class="icon-btn del" data-del="${i}" title="Hapus">${icon('trash',15)}</button></td>

}

/* Tag chip "Picker" (multi-value). Tombol hapus (x) per chip disembunyikan
   kalau `readonly` true (dipakai kalau ke depan modul ini butuh mode
   Lihat — saat ini tidak dipakai karena list Picking List tidak punya
   aksi Lihat, cuma Cetak/Checked/Ubah/Hapus, sesuai spesifikasi). */
function tplPklPickerTags(picker, readonly){
  if(!picker || !picker.length) return `<span style="font-size:11.5px;color:var(--text-light);">Belum ada Picker dipilih</span>`;
  return picker.map((name,i)=>`<span class="tag-chip">${name}${!readonly?`<span class="rm" data-rm-picker="${i}">&times;</span>`:''}</span>`).join('');
}

/* Baris alokasi Batch yang sudah dipilih untuk 1 item (ditampilkan di
   bawah kotak cari Batch dalam sel "Batch Number"). */
function tplPklBatchAllocRows(item, idx, dis){
  if(!item.batches || !item.batches.length) return `<div style="font-size:11px;color:var(--text-light);margin-top:4px;">Belum ada batch dipilih</div>`;
  return item.batches.map((b,bi)=>`
    <div style="display:flex;gap:8px;align-items:center;font-size:11.5px;padding:3px 0;border-bottom:1px dashed var(--border);">

      <span style="width:88px;">${b.tglExpired||''}</span>
      ${!dis ? `<span class="icon-btn del" style="width:20px;height:20px;cursor:pointer;" data-pkl-batch-del="${idx}:${bi}" title="Hapus">${icon('trash',11)}</span>` : ''}

}

function jamOptions(sel){
  let out = '';
  for(let h=0; h<24; h++) out += `<option value="${h}" ${(+sel)===h?'selected':''}>${String(h).padStart(2,'0')}</option>`;
  return out;
}
function menitOptions(sel){
  return [0,15,30,45].map(m=>`<option value="${m}" ${(+sel)===m?'selected':''}>${String(m).padStart(2,'0')}</option>`).join('');
}
function dayNumberOptions(sel){
  let out = '';
  for(let d=1; d<=31; d++) out += `<option value="${d}" ${(+sel)===d?'selected':''}>${d}</option>`;
  return out;
}

function tplPromotionFormBody(mode, row){
  if(row.kategori === 'A') return tplPromDiscountProgram(mode, row);
  if(row.kategori === 'DPF') return tplPromDiscountProposal(mode, row, {showKuota:true});
  if(row.kategori === 'DPL') return tplPromDiscountProposal(mode, row, {showKuota:false});
  if(row.kategori === 'CAT') return tplPromDiscountCategory(mode, row);
  return tplPromDiscountProgram(mode, row);
}

/* Status Approval ditampilkan sebagai teks berwarna, mengikuti pola
   .st-open/.st-closed di Stock Request (Approved=hijau reuse .st-open,
   Rejected=merah reuse .st-closed). "Pending" butuh warna ke-3 —
   dipakai inline style kuning (var(--yellow)) alih-alih menambah class
   CSS baru, supaya tidak nambah CSS untuk 1 kondisi saja. */
function tplSoApprovalText(status){
  if(status === 'Approved') return `<span class="st-open">${status}</span>`;
  if(status === 'Rejected') return `<span class="st-closed">${status}</span>`;
  return `<span style="color:var(--yellow);font-weight:700;">${status}</span>`;
}

/* Kelompokkan array items (dari row.items / DATA.items) berdasarkan
   field kategori, sambil menjaga urutan kemunculan pertama kali. */
function srGroupItemsByKategori(items){
  const order = [];
  const map = {};
  items.forEach(it=>{
    const k = it.kategori || 'Lainnya';
    if(!map[k]){ map[k] = []; order.push(k); }
    map[k].push(it);
  });
  return order.map(k=>({kategori:k, items:map[k]}));
}

function openAkGlModal(mode, idx){
  closeModal();
  const row = mode==='edit' ? DATA.akunGL[idx] : {kode:'', nama:'', kategori:DATA.glKategori[0].kode, tipe:'D', jenis:'Detail', saldoAwal:0, debet:0, kredit:0, saldoAkhir:0};
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=tplAkGlModal(mode, row);
  document.body.appendChild(overlay);
  document.getElementById('modalClose').onclick=closeModal;
  document.getElementById('modalCancel').onclick=closeModal;
  overlay.onclick=(e)=>{ if(e.target===overlay) closeModal(); };
  document.getElementById('modalSave').onclick=()=>{
    const kode=document.getElementById('fAkKode').value.trim();
    const nama=document.getElementById('fAkNama').value.trim();
    const kategori=document.getElementById('fAkKategori').value;
    const tipe=document.getElementById('fAkTipe').value;
    const jenis=document.getElementById('fAkJenis').value;
    const parseNum=(id)=>parseFloat(document.getElementById(id).value.trim().replace(/\./g,'').replace(',', '.'))||0;
    const saldoAwal=parseNum('fAkSaldoAwal');
    const debet=parseNum('fAkDebet');
    const kredit=parseNum('fAkKredit');
    let ok=true;
    if(!kode){ document.getElementById('fAkKodeErr').style.display='block'; ok=false; } else { document.getElementById('fAkKodeErr').style.display='none'; }
    if(!nama){ document.getElementById('fAkNamaErr').style.display='block'; ok=false; } else { document.getElementById('fAkNamaErr').style.display='none'; }
    if(!ok) return;
    const saldoAkhir = tipe==='K' ? (saldoAwal - debet + kredit) : (saldoAwal + debet - kredit);
    const newRow={kode, nama, kategori, tipe, jenis, saldoAwal, debet, kredit, saldoAkhir};
    if(mode==='add'){ DATA.akunGL.push(newRow); }
    else { DATA.akunGL[idx]=newRow; }
    closeModal();
    renderAkGlTable();
  };
}

function openAkGlDeleteConfirm(idx){

  const row=DATA.akunGL[idx];
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=tplAkGlDeleteConfirm(row);

   tplCgLegalitasSectionsWrap/tplCgSyaratPicker/tplCgBuPicker/dst,

   dipakai bersama di sini).
   NB: closeModal() dipakai bersama, didefinisikan di core.js.

   Pola CRUD: list + form FULL PAGE (bukan modal, karena field
   sangat banyak — 6 checkbox Legalitas dinamis + sub-grid Badan
   Usaha), sama seperti Master Supplier/Kategori Barang. Bagian
   PALING KHAS modul ini: 6 checkbox "Legalitas ..." yang begitu
   dicentang langsung MEMUNCULKAN sub-grid terkait di bawahnya
   (live, tanpa Simpan dulu) — state tiap sub-grid disimpan di
   `cgLegalitasRows` (object, key = rowsKey dari CG_LEGALITAS_SECTIONS),
   dan direnderkan ulang oleh `renderCgLegalitasSections(row)` setiap
   kali sebuah checkbox berubah ATAU sebuah baris sub-grid
   ditambah/dihapus/diisi — fungsi ini membaca status checkbox
   LANGSUNG dari DOM (bukan dari `row`), jadi checkbox tidak perlu
   ikut di-render ulang.
========================================================= */
let cgLegalitasRows = {};
let cgBuRows = [];

function renderCustomerGroupPage(){
  renderCgList();
}

function renderCgList(){
  content.innerHTML = tplCustomerGroupListPage();
  document.getElementById('btnCgAdd').onclick = () => openCgForm('add');
  document.getElementById('btnCgGenerate').onclick = () => openCgInfo('Generate Customer Group ke Customer Type', 'Fitur generate otomatis Customer Group ke Customer Type akan tersedia di modul "Tipe Customer".');
  renderCgTable();
}

function renderCgTable(){
  const tbody = document.getElementById('cgTbody');
  const total = document.getElementById('cgTotal');
  tbody.innerHTML = tplCgRows(DATA.customerGroup);
  total.textContent = `Total Record: ${DATA.customerGroup.length}`;
  tbody.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openCgForm('edit', +b.dataset.edit));
  tbody.querySelectorAll('[data-del]').forEach(b => b.onclick = () => openCgDeleteConfirm(+b.dataset.del));
}

function cgEmptyRow(){
  const row = { kode:'', nama:'', diskon1:0, diskon2:0, mataUang:'IDR', alamat:'', telepon:'', fax:'', kontakPerson:'', minBatasKredit:0, dominasi:false, badanUsaha:[] };
  CG_LEGALITAS_SECTIONS.forEach(sec => { row[sec.key] = false; row[sec.rowsKey] = []; });
  return row;
}

function openCgForm(mode, idx){
  const row = mode === 'edit'
    ? { ...DATA.customerGroup[idx], badanUsaha: (DATA.customerGroup[idx].badanUsaha||[]).map(b=>({...b})) }
    : cgEmptyRow();

  cgLegalitasRows = {};
  CG_LEGALITAS_SECTIONS.forEach(sec => { cgLegalitasRows[sec.rowsKey] = (row[sec.rowsKey]||[]).map(s=>({...s})); });
  cgBuRows = (row.badanUsaha||[]).map(b=>({...b}));

  content.innerHTML = tplCustomerGroupForm(mode, row);
  renderCgLegalitasSections(row);
  renderCgBuRows();

  document.getElementById('btnCgTutorial').onclick = () => openCgInfo('Tutorial', 'Video tutorial pengisian Grup Customer akan tersedia di sini.');

  CG_LEGALITAS_SECTIONS.forEach(sec => {
    document.getElementById(`fCg_${sec.key}`).onchange = () => renderCgLegalitasSections(row);
  });

  document.getElementById('cgBuAddRow').onclick = (e) => { e.preventDefault(); cgBuRows.push({kode:'',nama:''}); renderCgBuRows(); };

  document.getElementById('cgCancel').onclick = () => renderCgList();
  document.getElementById('cgSave').onclick = () => {
    const kode = document.getElementById('fCgKode').value.trim();
    const nama = document.getElementById('fCgNama').value.trim();
    if(!kode || !nama){ cgValidationError('Kode Grup Customer dan Nama Grup Customer wajib diisi'); return; }
    row.kode = kode;
    row.nama = nama;
    row.mataUang = document.getElementById('fCgMataUang').value;
    row.alamat = document.getElementById('fCgAlamat').value.trim();
    row.telepon = document.getElementById('fCgTelepon').value.trim();
    row.fax = document.getElementById('fCgFax').value.trim();
    row.kontakPerson = document.getElementById('fCgKontakPerson').value.trim();
    const kreditRaw = document.getElementById('fCgMinBatasKredit').value.trim().replace(/\./g,'').replace(',', '.');
    row.minBatasKredit = parseFloat(kreditRaw) || 0;
    row.dominasi = document.getElementById('fCgDominasi').checked;
    CG_LEGALITAS_SECTIONS.forEach(sec => {
      row[sec.key] = document.getElementById(`fCg_${sec.key}`).checked;
      row[sec.rowsKey] = cgLegalitasRows[sec.rowsKey].filter(s => s.kode);
    });
    row.badanUsaha = cgBuRows.filter(b => b.kode);
    if(mode === 'add'){
      DATA.customerGroup.push(row);
    } else {
      DATA.customerGroup[idx] = row;
    }
    renderCgList();
  };
}

/* Render ulang wrap sub-grid Legalitas berdasar status checkbox SAAT INI
   (dibaca langsung dari DOM) — checkbox sendiri tidak ikut di-render ulang
   di sini, jadi checked state-nya tetap terjaga. */
function renderCgLegalitasSections(row){
  const wrap = document.getElementById('cgLegalitasSectionsWrap');
  if(!wrap) return;
  const visible = CG_LEGALITAS_SECTIONS.filter(sec => document.getElementById(`fCg_${sec.key}`)?.checked);
  wrap.innerHTML = visible.map(sec => tplCgLegalitasSection(sec, cgLegalitasRows[sec.rowsKey] || [])).join('');

  wrap.querySelectorAll('[data-cg-add]').forEach(a => a.onclick = (e) => {
    e.preventDefault();
    const rowsKey = a.dataset.cgAdd;
    cgLegalitasRows[rowsKey].push({kode:'',nama:''});
    renderCgLegalitasSections(row);
  });
  wrap.querySelectorAll('[data-cg-search]').forEach(b => b.onclick = () => {
    const [rowsKey, idx] = b.dataset.cgSearch.split(':');
    openCgSyaratPicker(rowsKey, +idx, row);
  });
  wrap.querySelectorAll('[data-cg-rm]').forEach(b => b.onclick = () => {
    const [rowsKey, idx] = b.dataset.cgRm.split(':');
    cgLegalitasRows[rowsKey].splice(+idx, 1);
    renderCgLegalitasSections(row);
  });
}

function openCgSyaratPicker(rowsKey, idx, row){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = tplCgSyaratPicker(DATA.syaratCustomerGrup, rowsKey, idx);
  document.body.appendChild(overlay);
  document.getElementById('pickerClose').onclick = closeModal;
  document.getElementById('pickerCancel').onclick = closeModal;
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  overlay.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const s = DATA.syaratCustomerGrup.find(x => x.kode === b.dataset.pick);
    cgLegalitasRows[rowsKey][idx] = { kode:s.kode, nama:s.nama };
    closeModal();
    renderCgLegalitasSections(row);
  });
}

function renderCgBuRows(){
  const wrap = document.getElementById('cgBuWrap');
  if(!wrap) return;
  wrap.innerHTML = tplCgBuRows(cgBuRows);
  wrap.querySelectorAll('[data-cg-bu-search]').forEach(b => b.onclick = () => openCgBuPicker(+b.dataset.cgBuSearch));
  wrap.querySelectorAll('[data-cg-bu-rm]').forEach(b => b.onclick = () => { cgBuRows.splice(+b.dataset.cgBuRm, 1); renderCgBuRows(); });

/* No. Faktur auto-generate — format "26/SI/<KODE>/08/<seq>", offset 50
   dipakai supaya nomor baru terlihat "melanjutkan" seri seq besar yang
   sudah dipakai di 8 baris sample (095-182, lihat komentar di
   js/data.js), murni dekoratif/kosmetik, tidak divalidasi unik. */
function fktGenerateNumber(cabang){
  const kode = FKT_CABANG_CODE[cabang] || 'XXX';
  const seq = 50 + DATA.fakturPenjualanSJ.filter(r => r.cabang === cabang).length + 1;
  return `26/SI/${kode}/08/${String(seq).padStart(5, '0')}`;
}

function fktBuildEmptyRow(){
  const cabang0 = FKT_CABANG_LIST[0];
  const tglFaktur0 = '12/08/2026';
  const syaratBayar0 = FKT_SYARAT_BAYAR_LIST[0];
  return {
    no: fktGenerateNumber(cabang0), cabang: cabang0,
    tglFaktur: tglFaktur0, tglJatuhTempo: fktJatuhTempo(tglFaktur0, syaratBayar0), syaratBayar: syaratBayar0,
    customerKode:'', customerNama:'', customerAlamat:'',
    noDSC:'', principalKode:'', principalNama:'', noReturSJ:'', noPacking:'',
    dariSO:'', dariSJ:'', noSP:'', tglSP:'',
    jurnal: DATA.jurnalPenjualan[0].nama, salesman:'', poCustomer:'', driver:'', kernet:'',
    alamatPengirimanTipe: FKT_ALAMAT_TIPE_LIST[0], alamatPengiriman:'',
    tglBatasRetur:'', tipeLayanan: DATA.layananList[0],
    items:[],
    tipePpn: FKT_PPN_LIST[3], mataUang:'Rupiah (IDR)', kursPajak:0, tglFakturPajak:'', kodePajak: DATA.kodePajakList[0], noFakturPajak:'',
    diskon1:0, diskon1Amount:0, diskon2:0, diskon2Amount:0, kurs:1, dpp:0, pajak11:'PPN11',
    uangMukaTipe: FKT_UANG_MUKA_LIST[0], sisaUangMuka:0, uangMukaPakai:0,
    pphAktif:false, pphKode:'', pphPersen:0, pphAmount:0,
    ongkosAngkut:0, ppn:0, jumlahAkhir:0, sisaJumlah:0,
    keterangan:'', tipeTransaksi: syaratBayar0==='CBD' ? 'Penjualan Tunai' : 'Penjualan Kredit',
    tglInput:'', userInput:'', tglEdit:'', userEdit:'',
  };
}

function fktBuildEmptyItem(){
  return { kode:'', nama:'', keterangan:'', qtyPhysical:1, um:'', hna:0, hna1:0, discPrincipal:0, discDistributor:0, totalDisc:0, discBarang:0, jumlah:0, kodePromosi:'', ppnChecked:true };
}

/* Kalkulasi murni 1 baris item — TIDAK menyentuh DOM (pola identik
   poRecalcItem() di Purchase Order). Disc/Barang = HNA1 x Total Disc%
   (NOMINAL PER-UNIT, bukan total), Jumlah = (HNA1 - Disc/Barang) x Qty
   Physical — sesuai rumus yang didokumentasikan di atas
   DATA.fakturPenjualanSJ, js/data.js. */
function fktRecalcItem(item){
  item.totalDisc = (+item.discPrincipal || 0) + (+item.discDistributor || 0);
  item.discBarang = Math.round((+item.hna1 || 0) * item.totalDisc / 100);
  item.jumlah = Math.round(((+item.hna1 || 0) - item.discBarang) * (+item.qtyPhysical || 0));
}

function fktRefreshItemRowDOM(idx, item){
  const totalDiscEl = document.querySelector(`[data-fkt-totaldisc="${idx}"]`);
  const discBarangEl = document.querySelector(`[data-fkt-discbarang="${idx}"]`);
  const jumlahEl = document.querySelector(`[data-fkt-jumlah="${idx}"]`);
  if(totalDiscEl) totalDiscEl.value = item.totalDisc;
  if(discBarangEl) discBarangEl.value = num(item.discBarang);
  if(jumlahEl) jumlahEl.value = num(item.jumlah);
}

/* Rekalkulasi total dokumen (DPP/Diskon/PPN/PPh/Uang Muka/Jumlah
   Akhir/Sisa Jumlah) — pola pisah hitung-murni/update-DOM yang sama
   seperti poRecalcTotals()/poRefreshTotalsDOM() di Purchase Order.
   Asumsi: row.diskon1/diskon2/ongkosAngkut/uangMukaPakai/tipePpn/
   pphAktif/pphPersen SUDAH di-update ke `row` oleh handler pemanggil
   SEBELUM fungsi ini dipanggil (bukan dibaca ulang dari DOM di sini). */
function fktRecalcTotals(row){
  const subtotal = row.items.reduce((s, it) => s + (+it.jumlah || 0), 0);
  row.diskon1Amount = Math.round(subtotal * (+row.diskon1 || 0) / 100);
  row.diskon2Amount = Math.round(subtotal * (+row.diskon2 || 0) / 100);
  row.dpp = subtotal - row.diskon1Amount - row.diskon2Amount;
  row.pajak11 = (row.tipePpn === 'PPN Inklusif' || row.tipePpn === 'PPN Eksklusif(+11%)') ? 'PPN11' : '';
  row.ppn = (row.tipePpn === 'PPN Eksklusif(+11%)') ? Math.round(row.dpp * 0.11) : 0;
  row.pphAmount = row.pphAktif ? Math.round(row.dpp * (+row.pphPersen || 0) / 100) : 0;
  row.jumlahAkhir = Math.round(row.dpp + row.ppn - row.pphAmount + (+row.ongkosAngkut || 0));
  row.sisaJumlah = row.jumlahAkhir - (+row.uangMukaPakai || 0);
}

function fktRefreshTotalsDOM(row){
  document.getElementById('fFktDiskon1Rp').value = num(row.diskon1Amount);
  document.getElementById('fFktDiskon2Rp').value = num(row.diskon2Amount);
  document.getElementById('fFktDpp').value = num(row.dpp);
  document.getElementById('fFktPajak11').value = row.pajak11;
  document.getElementById('fFktPpnAmount').value = num(row.ppn);
  document.getElementById('fFktPphAmount').value = num(row.pphAmount);
  document.getElementById('fFktJumlahAkhir').value = num(row.jumlahAkhir);
  document.getElementById('fFktSisaJumlah').value = num(row.sisaJumlah);
}

function fktTogglePpnSubfields(mode){
  const el = document.getElementById('fktPpnSubfields');
  if(!el) return;
  el.style.display = (mode === 'PPN Inklusif' || mode === 'PPN Eksklusif(+11%)') ? '' : 'none';
}

/* ===== Helper bersama "terapkan 1 Invoice" — dipanggil dari
   openFktSoPicker() MAUPUN openFktSjPicker() (lihat komentar header
   file ini). Driver HANYA dibawa kalau shipVia Invoice sumbernya
   'Driver' (kalau Ekspedisi/Diambil Sendiri/Dikirim Supplier, Driver
   dikosongkan) — sesuai catatan desain di atas DATA.fakturPenjualanSJ.
   Kernet TIDAK ada sumbernya di DATA.invoices (field baru, belum ada
   di modul manapun sebelum ini) sehingga TIDAK disentuh di sini —
   dibiarkan seperti isi row saat ini, dipilih manual lewat picker
   Kernet sendiri. ===== */
function fktApplyInvoice(row, invRow){
  row.dariSO = invRow.noSO || '';
  row.dariSJ = invRow.noSJ || '';
  row.customerKode = invRow.customerKode || '';
  row.customerNama = invRow.customerNama || '';
  row.customerAlamat = invRow.customerAlamat || '';
  row.noSP = invRow.noSP || '';
  row.tglSP = invRow.tglSP || '';
  row.noDSC = invRow.noDSC || '';
  row.principalKode = invRow.principalKode || '';
  row.principalNama = invRow.principalNama || '';
  row.syaratBayar = invRow.syaratBayar || row.syaratBayar || FKT_SYARAT_BAYAR_LIST[0];
  row.alamatPengiriman = invRow.alamatPengiriman || invRow.customerAlamat || '';
  row.tipeLayanan = invRow.layanan || row.tipeLayanan || DATA.layananList[0];
  row.driver = (invRow.shipVia === 'Driver') ? (invRow.driver || '') : '';
  row.cabang = invRow.cabang || row.cabang;
  row.tipeTransaksi = (row.syaratBayar === 'CBD') ? 'Penjualan Tunai' : 'Penjualan Kredit';
  row.items = (invRow.items || []).map(it => fktBuildItemFromInvoiceItem(it));
  row.items.forEach(fktRecalcItem);
}

/* Barang di tabel Invoice sumber ({kode,nama,satuan,qtyPesan,qtyKirim,
   batch,ed}) dikonversi jadi baris item Faktur — HNA/HNA1 diambil dari
   DATA.items[].harga (barang yang kode-nya tidak ketemu dianggap 0),
   Qty Physical awal = Qty Kirim Invoice-nya, Disc Principal/Distributor
   default 0 (baru dihitung sungguhan kalau memang match DATA.promotion,
   lihat catatan di js/data.js — untuk hasil PILIH INTERAKTIF di form ini
   disederhanakan jadi 0/user isi manual, BUKAN mengulang lookup promosi
   otomatis, konsisten dengan Kode Promosi yang murni tampilan). */
function fktBuildItemFromInvoiceItem(it){
  const master = DATA.items.find(x => x.kode === it.kode);
  const harga = master ? (+master.harga || 0) : 0;
  return {
    kode: it.kode, nama: it.nama, keterangan:'', qtyPhysical: it.qtyKirim || 0, um: it.satuan || '',
    hna: harga, hna1: harga, discPrincipal:0, discDistributor:0, totalDisc:0, discBarang:0, jumlah:0,
    kodePromosi:'', ppnChecked:true,
  };
}

function openFktForm(mode, idx){
  let row;
  const isAdd = mode === 'add';
  const isView = mode === 'view';
  if(isAdd){
    row = fktBuildEmptyRow();
  } else {
    const src = DATA.fakturPenjualanSJ[idx];
    row = { ...src, items: src.items.map(it => ({ ...it })) };
  }

  // Rekalkulasi sekali sebelum render — supaya field turunan yang
  // TIDAK disimpan mentah di DATA.fakturPenjualanSJ (mis. `pajak11`,
  // yang cuma ada di hasil poRecalcTotals-style, bukan field asli di
  // js/data.js) tetap benar begitu form dibuka, baik mode Tambah,
  // Ubah, MAUPUN Lihat (bukan cuma reaktif setelah interaksi user).
  row.items.forEach(fktRecalcItem);
  fktRecalcTotals(row);

  content.innerHTML = tplFktForm(mode, row);

  if(isView){
    document.getElementById('fktTutup').onclick = (e) => { e.preventDefault(); renderFktList(); };
    return;
  }

  const isEdit = !isAdd;
  const btnTutorial = document.getElementById('btnFktTutorial');
  if(btnTutorial) btnTutorial.onclick = () => openFktInfo('Tutorial', 'Video tutorial pengisian Faktur Penjualan Via S.J. akan tersedia di sini.');

  if(isAdd){
    document.getElementById('fFktCabang').onchange = (e) => {
      row.cabang = e.target.value;
      row.no = fktGenerateNumber(row.cabang);
      document.getElementById('fFktNoFaktur').value = row.no;
    };
  }

  const recomputeJatuhTempo = () => {
    row.tglFaktur = document.getElementById('fFktTglFaktur').value;
    row.syaratBayar = document.getElementById('fFktSyaratBayar').value;
    row.tglJatuhTempo = fktJatuhTempo(row.tglFaktur, row.syaratBayar);
    document.getElementById('fFktTglJthTempo').value = row.tglJatuhTempo;
    row.tipeTransaksi = (row.syaratBayar === 'CBD') ? 'Penjualan Tunai' : 'Penjualan Kredit';
  };
  // Tgl. Jth. Tempo dihitung otomatis (fktJatuhTempo()) tiap kali Tgl.
  // Faktur atau Syarat Bayar berubah, di mode Tambah (lihat spesifikasi
  // modul ini) — tetap diwire juga di mode Ubah karena tidak berbahaya
  // & tetap berguna kalau user mengoreksi Tgl. Faktur/Syarat Bayar.
  document.getElementById('fFktTglFaktur').onchange = recomputeJatuhTempo;
  document.getElementById('fFktSyaratBayar').onchange = recomputeJatuhTempo;

  document.getElementById('fktSoSearch').onclick = () => openFktInvoicePicker(row, isAdd, 'Pilih Sales Order');
  document.getElementById('fktSjSearch').onclick = () => openFktInvoicePicker(row, isAdd, 'Pilih S.J.');
  document.getElementById('fktSalesmanSearch').onclick = () => openFktSalesmanPicker(row);
  document.getElementById('fktDriverSearch').onclick = () => openFktDriverPicker(row);
  document.getElementById('fktKernetSearch').onclick = () => openFktKernetPicker(row);

  wireFktTabs();
  wireFktItemEvents(row);
  document.getElementById('fktAddItem').onclick = (e) => {
    e.preventDefault();
    row.items.push(fktBuildEmptyItem());
    rerenderFktItemsTable(row);
  };

  document.querySelectorAll('input[name="fktPpnMode"]').forEach(r => r.onchange = (e) => {
    row.tipePpn = e.target.value;
    fktTogglePpnSubfields(row.tipePpn);
    fktRecalcTotals(row);
    fktRefreshTotalsDOM(row);
  });
  document.querySelectorAll('input[name="fktUangMukaTipe"]').forEach(r => r.onchange = (e) => { row.uangMukaTipe = e.target.value; });

  ['fFktDiskon1','fFktDiskon2','fFktOngkosAngkut','fFktUangMukaPakai'].forEach(id => {
    document.getElementById(id).onchange = (e) => {
      const key = { fFktDiskon1:'diskon1', fFktDiskon2:'diskon2', fFktOngkosAngkut:'ongkosAngkut', fFktUangMukaPakai:'uangMukaPakai' }[id];
      row[key] = +e.target.value || 0;
      fktRecalcTotals(row);
      fktRefreshTotalsDOM(row);
    };
  });
  // Kurs Pajak/Tgl. Faktur Pajak/Kode Pajak — dekoratif (tidak
  // memengaruhi kalkulasi PPN, sama seperti Kurs di Purchase Order),
  // cuma disimpan ke `row` supaya tidak hilang saat Simpan.
  document.getElementById('fFktKursPajak').onchange = (e) => { row.kursPajak = +e.target.value || 0; };

function wireFktTabs(){

function wireFktItemEvents(row){
  row.items.forEach((item, idx) => {
    const ppnCb = document.querySelector(`[data-fkt-ppn="${idx}"]`);
    const searchBtn = document.querySelector(`[data-fkt-item-search="${idx}"]`);
    const delBtn = document.querySelector(`[data-fkt-item-del="${idx}"]`);
    const keteranganEl = document.querySelector(`[data-fkt-keterangan="${idx}"]`);
    const qtyEl = document.querySelector(`[data-fkt-qty="${idx}"]`);
    const discpEl = document.querySelector(`[data-fkt-discp="${idx}"]`);
    const discdEl = document.querySelector(`[data-fkt-discd="${idx}"]`);

    if(ppnCb) ppnCb.onchange = () => { item.ppnChecked = ppnCb.checked; };
    if(searchBtn) searchBtn.onclick = () => openFktItemPicker(idx, row);
    if(delBtn) delBtn.onclick = () => {
      if(row.items.length <= 1){ fktValidationError('Minimal harus ada 1 baris barang'); return; }
      row.items.splice(idx, 1);
      rerenderFktItemsTable(row);
    };
    if(keteranganEl) keteranganEl.onchange = () => { item.keterangan = keteranganEl.value; };
    [qtyEl, discpEl, discdEl].forEach(el => {
      if(!el) return;
      el.onchange = () => {
        item.qtyPhysical = qtyEl ? (+qtyEl.value || 0) : item.qtyPhysical;
        item.discPrincipal = discpEl ? (+discpEl.value || 0) : item.discPrincipal;
        item.discDistributor = discdEl ? (+discdEl.value || 0) : item.discDistributor;
        fktRecalcItem(item);
        fktRefreshItemRowDOM(idx, item);
        fktRecalcTotals(row);
        fktRefreshTotalsDOM(row);
      };
    });
  });
}

function rerenderFktItemsTable(row){
  document.getElementById('fktItemsBody').innerHTML = row.items.map((it,idx) => tplFktItemRow(it,idx,'')).join('');
  wireFktItemEvents(row);
  const hint = document.getElementById('fktItemsEmptyHint');
  if(hint) hint.style.display = row.items.length ? 'none' : '';
  fktRecalcTotals(row);
  fktRefreshTotalsDOM(row);
}

function fktValidationError(text){
  openFktInfo('Validasi', text);

   dari yang sedang tampil, No. Faktur ikut di-generate ULANG supaya

  document.getElementById('fFktAlamatPengiriman').value = row.alamatPengiriman || '';

  row.tglFaktur = document.getElementById('fFktTglFaktur').value;
  row.tglJatuhTempo = fktJatuhTempo(row.tglFaktur, row.syaratBayar);
  document.getElementById('fFktTglJthTempo').value = row.tglJatuhTempo;

  if(isAdd && cabangEl && row.cabang && cabangEl.value !== row.cabang){
    cabangEl.value = row.cabang;

    document.getElementById('fFktNoFaktur').value = row.no;
  }

  rerenderFktItemsTable(row);
}

/* =========================================================
   LOGIC (JS saja) — Master Gudang (Persediaan Barang > Master &
   Setting > Gudang). Dimuat otomatis (lazy-load) oleh core.js saat
   menu ini pertama kali diklik — lihat PAGE_MODULES di js/core.js.
   Markup HTML-nya ada di file sebelah: gudang.template.js
   (tplGudangListPage/tplGdgRows/tplGudangForm/tplGdgDeleteConfirm/
   tplGdgInfoModal, plus konstanta GDG_CABANG_LIST/GDG_CABANG_CODE).
   NB: closeModal() dipakai bersama, didefinisikan di core.js.

   Pola CRUD: list + form FULL PAGE (sama seperti Jurnal Pembelian/
   Kategori Barang/Picking List), field cukup sederhana (tanpa
   sub-grid/tabel reaktif) jadi tidak perlu state sementara di
   variabel modul seperti modul CRUD besar lainnya.

   Kode Gudang SELALU readonly/disabled (baik Tambah maupun Ubah) —
   auto-generate dari Cabang yang dipilih, format `<NN>-GUU` untuk
   gudang pertama di cabang itu, `<NN>-GUU-02`/`-03`/dst untuk gudang
   berikutnya (NN dari GDG_CABANG_CODE). Di mode Tambah, kalau user
   ganti dropdown Cabang, Kode Gudang (dan usulan Nama Gudang) di-
   generate ULANG mengikuti cabang baru — pola regenerasi-saat-ganti-
   cabang ini sama seperti No.IVC/No.SJ di Invoice. Di mode Ubah,
   Cabang tetap bisa diganti tapi Kode Gudang yang sudah ada TIDAK
   ikut berubah (kode sudah jadi identitas record, bukan turunan
   otomatis lagi setelah tersimpan).
========================================================= */

function gdgNextKode(cabang, excludeIdx){
  const kodeAwal = GDG_CABANG_CODE[cabang] || '00';
  const existingCount = DATA.gudang.filter((g,i)=> g.cabang===cabang && i!==excludeIdx).length;
  const seq = existingCount + 1;
  return seq === 1 ? `${kodeAwal}-GUU` : `${kodeAwal}-GUU-${String(seq).padStart(2,'0')}`;
}

function gdgNextNama(cabang, excludeIdx){
  const abbr = { 'Head Office':'HO','Surabaya':'SBY','Bandung':'BDG','Tangerang':'TGR','Medan':'MDN','Makassar':'MKS','Semarang':'SMG','Sidoarjo':'SDA' }[cabang] || cabang;
  const existingCount = DATA.gudang.filter((g,i)=> g.cabang===cabang && i!==excludeIdx).length;
  const seq = existingCount + 1;
  return seq === 1 ? `Gudang Utama-${abbr}` : `Gudang Utama-${abbr} ${seq}`;
}

function openGdgForm(mode, idx){
  const row = mode === 'edit' ? { ...DATA.gudang[idx] } : gdgEmptyRow();

      document.getElementById('fGdgNama').value = gdgNextNama(cabang, -1);
    };
  }

  const cbCadangan = document.getElementById('fGdgCadangan');
  const inpHari = document.getElementById('fGdgHariPeringatan');
  cbCadangan.onchange = () => {
    if(cbCadangan.checked){ inpHari.style.display = 'inline-block'; }
    else { inpHari.style.display = 'none'; inpHari.value = ''; }

  document.getElementById('gdgCancel').onclick = (e) => { e.preventDefault(); renderGdgList(); };
  document.getElementById('gdgSave').onclick = () => {
    const nama = document.getElementById('fGdgNama').value.trim();
    if(!nama){ openGdgInfo('Validasi', 'Nama Gudang wajib diisi.'); return; }
    const hariVal = document.getElementById('fGdgHariPeringatan').value;
    const updated = {
      kode: document.getElementById('fGdgKode').value,
      nama,
      kepalaGudang: document.getElementById('fGdgKepala').value.trim(),
      keterangan: document.getElementById('fGdgKeterangan').value.trim(),
      default: document.getElementById('fGdgDefault').checked,

      gudangTransit: document.getElementById('fGdgTransit').checked,
      nearED: document.getElementById('fGdgNearED').checked,

      gudangCadangan: cbCadangan.checked,
      hariPeringatan: cbCadangan.checked && hariVal !== '' ? Number(hariVal) : null,
      konsinyasi: document.getElementById('fGdgKonsinyasi').checked,
    };
    if(mode === 'add'){ DATA.gudang.push(updated); }
    else { DATA.gudang[idx] = updated; }
    renderGdgList();
  };
}

========================================================= */

/* No. IVC & No. SJ SELALU berbagi 1 nomor urut yang sama (beda prefix
   saja, "SI" = Sales Invoice / "SJ" = Surat Jalan) — sesuai model
   mockup ini: 1 Invoice selalu punya persis 1 Surat Jalan pengantar. */
function invGenerateNumbers(cabang){
  const kode = INV_CABANG_CODE[cabang] || 'XXX';
  const seq = DATA.invoices.filter(r => r.cabang === cabang).length + 1;
  const seqStr = String(seq).padStart(5,'0');
  return { no: `26/SI/${kode}/08/${seqStr}`, noSJ: `26/SJ/${kode}/08/${seqStr}` };
}

/* ===== Helper bersama "terapkan 1 Picking List" — dipanggil dari
   openInvPlPicker() (langsung) MAUPUN openInvSoPicker() (setelah
   ketemu Picking List yang noSO-nya cocok) ===== */
function invApplyPickingList(row, plRow){
  row.noPL = plRow.no;
  row.noSO = plRow.noSO;
  const so = invFindSO(plRow.noSO);
  if(so){
    row.noSP = so.noSP || '';
    row.noDSC = so.noDSC || '';
    row.principalKode = so.principalKode || '';
    row.principalNama = so.principalNama || '';
    row.spAsli = !!so.spAsli;
    row.skEd = !!so.skEd;
    row.tglSP = so.tglSO || ''; // Sales Order tidak punya field tanggal SP terpisah, tglSO dipakai ulang (didokumentasikan)
  } else {
    row.noSP = ''; row.noDSC = ''; row.principalKode = ''; row.principalNama = '';
    row.spAsli = false; row.skEd = false; row.tglSP = '';
  }
  row.customerKode = plRow.customerKode || '';
  row.customerNama = plRow.customerNama || '';
  row.customerAlamat = plRow.customerAlamat || '';
  row.alamatPengiriman = plRow.customerAlamat || '';
  row.cabang = plRow.cabang;
  row.gudang = plRow.gudang;
  row.area = plRow.area;
  row.items = (plRow.items || []).map(it => ({
    kode: it.kode, nama: it.nama, satuan: it.satuan,
    qtyPesan: it.qtyOrder || 0, qtyKirim: it.qtyPicking || 0,
    batch: (it.batches && it.batches[0]) ? it.batches[0].kode : '',
    ed: (it.batches && it.batches[0]) ? it.batches[0].tglExpired : '',
  }));
}

/* Jumlah (total Invoice) — dihitung ulang saat Simpan dari
   DATA.items[].harga x qtyKirim per baris (barang yang kode-nya tidak
   ketemu di DATA.items diabaikan/dianggap 0, seharusnya tidak terjadi
   karena tabel Produk selalu berasal dari barang yang sudah valid di
   Picking List sumbernya). Field ini TIDAK ditampilkan sebagai total
   reaktif di form (tidak ada di 2 screenshot form), hanya dipakai untuk
   kolom "@Rp." di list — beda dari Sales Order/Purchase Order yang
   memang menampilkan Total DPP/PPN/Jumlah Akhir reaktif di form-nya. */
function invRecalcJumlah(row){
  row.jumlah = (row.items || []).reduce((sum, it) => {
    const master = DATA.items.find(x => x.kode === it.kode);
    const harga = master ? (+master.harga || 0) : 0;
    return sum + harga * (+it.qtyKirim || 0);
  }, 0);
}

function invBuildEmptyRow(){
  const cabang0 = INV_CABANG_LIST[0];
  const gen = invGenerateNumbers(cabang0);
  return {
    no: gen.no, noSJ: gen.noSJ, tglBuat: '', tgl: '11/08/2026', cabang: cabang0,
    gudang: INV_GUDANG_BY_CABANG[cabang0], area: '',
    customerKode:'', customerNama:'', customerAlamat:'',
    noSO:'', noPL:'', noSP:'', noDSC:'', principalKode:'', principalNama:'', tglSP:'',
    spAsli:false, skEd:false, cito:false, citoTgl:'11/08/2026',
    syaratBayar: INV_SYARAT_BAYAR_LIST[0], layanan: DATA.layananList[0],
    alamatPengiriman:'', shipVia: INV_SHIP_VIA_LIST[0], noResi:'', driver:'',
    keterangan:'', items:[], jumlah:0, posted:false, ts:'Create Invoice',
    tglInput:'', userInput:'', tglEdit:'', userEdit:'',
  };
}

function openInvForm(mode, idx){
  let row;
  const isAdd = mode === 'add';
  if(isAdd){
    row = invBuildEmptyRow();
  } else {
    const src = DATA.invoices[idx];
    row = { ...src, items: src.items.map(it => ({ ...it })) };
  }

  content.innerHTML = tplInvForm(mode, row);

  if(isAdd){
    document.getElementById('fInvCabang').onchange = (e) => {
      row.cabang = e.target.value;
      row.gudang = INV_GUDANG_BY_CABANG[row.cabang] || INV_GUDANG_LIST[0];
      const gen = invGenerateNumbers(row.cabang);
      row.no = gen.no; row.noSJ = gen.noSJ;
      document.getElementById('fInvGudang').value = row.gudang;
      document.getElementById('fInvNoIVC').value = row.no;
      document.getElementById('fInvNoSJ').value = row.noSJ;
    };
    document.getElementById('invRefreshNo').onclick = () => {
      const gen = invGenerateNumbers(document.getElementById('fInvCabang').value);
      row.no = gen.no; row.noSJ = gen.noSJ;
      document.getElementById('fInvNoIVC').value = row.no;
      document.getElementById('fInvNoSJ').value = row.noSJ;
    };
  }

  document.getElementById('invSoSearch').onclick = () => openInvSoPicker(row);
  document.getElementById('invPlSearch').onclick = () => openInvPlPicker(row);
  document.getElementById('invDriverSearch').onclick = () => openInvDriverPicker(row);

  wireInvTabs();
  wireInvItemEvents(row);

  document.getElementById('invBatalkan').onclick = (e) => { e.preventDefault(); renderInvList(); };
  const cetakBtn = document.getElementById('invCetak');
  if(cetakBtn) cetakBtn.onclick = () => openInvInfo('Cetak Invoice', `Preview PDF Invoice <b>${row.no}</b> akan tersedia di sini.`);

  document.getElementById('invSimpan').onclick = () => {
    if(!row.noSO && !row.noPL){ invValidationError('No SO atau No PL wajib dipilih terlebih dahulu'); return; }

    row.gudang = document.getElementById('fInvGudang').value;
    row.syaratBayar = document.getElementById('fInvSyaratBayar').value;
    row.layanan = document.getElementById('fInvLayanan').value;
    row.alamatPengiriman = document.getElementById('fInvAlamatKirim').value;
    row.shipVia = document.getElementById('fInvShipVia').value;
    row.noResi = document.getElementById('fInvNoResi').value;
    row.spAsli = document.getElementById('fInvSpAsli').checked;
    row.skEd = document.getElementById('fInvSkEd').checked;
    row.cito = document.getElementById('fInvCito').checked;
    row.keterangan = document.getElementById('fInvKeterangan').value;
    if(isAdd) row.cabang = document.getElementById('fInvCabang').value;

    invRecalcJumlah(row);

    if(isAdd){
      const gen = invGenerateNumbers(row.cabang);
      row.no = gen.no; row.noSJ = gen.noSJ;
      row.tglBuat = row.tgl + ' ' + new Date().toTimeString().slice(0,5);
      row.tglInput = row.tglBuat;
      row.userInput = 'sidik';
      DATA.invoices.push(row);
    } else {
      row.tglEdit = row.tgl + ' ' + new Date().toTimeString().slice(0,5);
      row.userEdit = 'sidik';
      DATA.invoices[idx] = row;
    }
    renderInvList();
  };
}

/* ===== Tab switcher "Detail Transaksi" / "Rincian Jurnal Akun" — pola
   UI baru di mockup ini (belum ada modul lain yang butuh tab), dibuat
   minimal: 2 tombol toggle class .active + toggle visibility 2 div
   konten, tanpa animasi. ===== */
function wireInvTabs(){
  const btnDetail = document.getElementById('invTabDetailBtn');
  const btnJurnal = document.getElementById('invTabJurnalBtn');
  const contentDetail = document.getElementById('invTabDetailContent');
  const contentJurnal = document.getElementById('invTabJurnalContent');
  btnDetail.onclick = () => {
    btnDetail.classList.add('active'); btnJurnal.classList.remove('active');
    contentDetail.style.display = ''; contentJurnal.style.display = 'none';
  };
  btnJurnal.onclick = () => {
    btnJurnal.classList.add('active'); btnDetail.classList.remove('active');
    contentJurnal.style.display = ''; contentDetail.style.display = 'none';
  };
}

/* ===== Tabel Produk: hanya Qty Kirim yang reaktif (tidak ada
   tambah/hapus baris, tidak ada kalkulasi total ditampilkan di form —
   lihat catatan invRecalcJumlah()). ===== */
function wireInvItemEvents(row){
  row.items.forEach((item, idx) => {
    const qtyKirimEl = document.querySelector(`[data-inv-qtykirim="${idx}"]`);
    if(qtyKirimEl) qtyKirimEl.onchange = () => { item.qtyKirim = +qtyKirimEl.value || 0; };
  });
}

function rerenderInvItemsTable(row){
  document.getElementById('invItemsBody').innerHTML = row.items.map((it,idx) => tplInvItemRow(it,idx)).join('');
  wireInvItemEvents(row);
  const hint = document.getElementById('invItemsEmptyHint');
  if(hint) hint.style.display = row.items.length ? 'none' : '';
}

/* Picker "No PL" — sumber utama pengisian rantai data (lihat komentar
   header file ini & invApplyPickingList()). */
function openInvPlPicker(row){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = tplInvPlPicker(DATA.pickingList);
  document.body.appendChild(overlay);
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  overlay.querySelectorAll('[data-pick-pl]').forEach(btn => btn.onclick = () => {
    const plRow = invFindPL(btn.dataset.pickPl);
    if(!plRow) return;
    invApplyPickingList(row, plRow);
    invSyncFormAfterPick(row);
    closeModal();
  });
}

/* Picker "No SO" — kalau Sales Order yang dipilih SUDAH punya Picking
   List terkait (dicari lewat noSO), reuse invApplyPickingList() supaya
   No PL & tabel Produk ikut terisi otomatis; kalau belum ada Picking
   List sama sekali untuk SO itu, No PL & tabel Produk dibiarkan kosong
   (skenario valid — belum semua SO sudah di-Picking List di sample
   data ini). */
function openInvSoPicker(row){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = tplInvSoPicker(DATA.salesOrders);
  document.body.appendChild(overlay);
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  overlay.querySelectorAll('[data-pick-so]').forEach(btn => btn.onclick = () => {
    const so = invFindSO(btn.dataset.pickSo);
    if(!so) return;

    row.noSO = so.no;
    row.noSP = so.noSP || '';
    row.noDSC = so.noDSC || '';
    row.principalKode = so.principalKode || '';
    row.principalNama = so.principalNama || '';
    row.spAsli = !!so.spAsli;
    row.skEd = !!so.skEd;
    row.tglSP = so.tglSO || '';

    const cust = DATA.customers.find(c => c.nama === so.customer);
    if(cust){
      row.customerKode = cust.kode; row.customerNama = cust.nama; row.customerAlamat = cust.alamat || '';
    } else {
      row.customerKode = ''; row.customerNama = so.customer || ''; row.customerAlamat = '';
    }
    row.alamatPengiriman = row.customerAlamat;

    const plRow = DATA.pickingList.find(p => p.noSO === so.no);
    if(plRow){
      invApplyPickingList(row, plRow);
    } else {
      row.noPL = '';
      row.items = [];
    }

    invSyncFormAfterPick(row);
    closeModal();
  });
}

/* Sinkronkan seluruh input form yang bisa berubah gara-gara picker
   No SO / No PL (dipanggil dari kedua handler supaya tidak duplikasi
   baris DOM-update ini).
   NB: kalau Cabang ikut berubah (mode Tambah, field Cabang belum
   disabled) DAN cabang hasil pick beda dari yang sedang tampil, No.
   IVC/No. SJ ikut di-generate ULANG supaya kode cabang di nomor
   dokumen selalu konsisten dengan Cabang yang benar-benar terpakai —
   kalau tidak, nomor bisa "nyasar" pakai kode cabang default (mis.
   26/SI/HO/... padahal Cabang sudah pindah ke Tangerang). */
function invSyncFormAfterPick(row){
  document.getElementById('fInvNoSO').value = row.noSO || '';
  document.getElementById('fInvNoPL').value = row.noPL || '';
  document.getElementById('fInvPrincipal').value = row.principalNama || '';
  document.getElementById('fInvNoDSC').value = row.noDSC || '';
  document.getElementById('fInvNoSP').value = row.noSP || '';
  document.getElementById('fInvTglSP').value = row.tglSP || '';
  document.getElementById('fInvSpAsli').checked = !!row.spAsli;
  document.getElementById('fInvSkEd').checked = !!row.skEd;
  document.getElementById('fInvCustomerNama').value = row.customerNama || '';
  document.getElementById('fInvAlamatKirim').value = row.alamatPengiriman || '';
  const gudangEl = document.getElementById('fInvGudang');
  if(gudangEl) gudangEl.value = row.gudang || INV_GUDANG_LIST[0];
  const cabangEl = document.getElementById('fInvCabang');
  if(cabangEl && !cabangEl.disabled && row.cabang && cabangEl.value !== row.cabang){
    cabangEl.value = row.cabang;
    const gen = invGenerateNumbers(row.cabang);
    row.no = gen.no; row.noSJ = gen.noSJ;
    document.getElementById('fInvNoIVC').value = row.no;
    document.getElementById('fInvNoSJ').value = row.noSJ;
  }
  rerenderInvItemsTable(row);
}

   numerik terbesar yang sudah ada + 1, di-format ulang dengan lebar

   base data-nya diubah ke kode yang lebih panjang. Tombol kaca

function kbkNextKode(){
  const width = (DATA.kasBank[0] && DATA.kasBank[0].kode ? DATA.kasBank[0].kode.length : 6);
  const maxNum = DATA.kasBank.reduce((max,r)=> Math.max(max, Number(r.kode)||0), 0);
  return String(maxNum + 1).padStart(width, '0');
}

/* =========================================================
   LOGIC (JS saja) — Picking List (Customer & Penjualan, page
   key 'pickingList'). Dimuat otomatis (lazy-load) oleh core.js
   saat menu ini pertama kali diklik — lihat PAGE_MODULES di
   js/core.js. Markup HTML-nya ada di file sebelah:
   picking-list.template.js (tplPickingListPage/tplPklRows/
   tplPklForm/dst, plus konstanta PKL_CABANG_LIST/PKL_GUDANG_LIST/
   PKL_GUDANG_BY_CABANG/PKL_AREA_BY_CABANG/PKL_PREFIX_LIST yang
   dipakai bersama di sini).
   NB: closeModal() dipakai bersama, didefinisikan di core.js.

   Pola CRUD: list + form FULL PAGE (sama seperti Stock Request/
   Purchase Order/Sales Order), dengan fitur khusus:
   - Aksi "Checked" di list: dual-state (icon check teal kalau
     status masih 'Waiting Request Packing' -> modal konfirmasi
     yang memajukan status ke 'Terkirim'; icon trash merah kalau
     status sudah 'Terkirim' -> modal konfirmasi yang mengembalikan
     ke 'Waiting Request Packing') — TIDAK pakai confirm() bawaan
     browser, konsisten dengan seluruh mockup ini.
   - Picker "No. S.O." mengisi BANYAK field sekaligus (Customer,
     Area, Cabang, Gudang, dan seluruh baris item) — pola yang sama
     seperti openPoSrPicker() di Purchase Order.
   - Tabel item reaktif: Qty Picking -> helper "Ready: N" & Qty Sisa
     (lihat pklRecalcItem()/pklRefreshItemRowDOM(), pola pisah
     hitung-murni/update-DOM PERSIS seperti poRecalcItem()/
     poRefreshItemRowDOM() di Purchase Order), plus alokasi Batch
     Number per baris (sub-list kecil di dalam sel, bisa
     tambah/hapus baris alokasi lewat picker "Pilih Batch").
   - Field "Picker" adalah TAG INPUT multi-value (array of string) —
     komponen UI baru di mockup ini, lihat tplPklPickerTags() &
     renderPklPickerTags() di bawah.

   RUMUS Ready & Qty Sisa (keputusan desain, didokumentasikan
   karena tidak bisa direkonsiliasi langsung dari 1 angka di
   screenshot — lihat juga komentar di DATA.batchStock, js/data.js):
   - Ready (helper teks di bawah input Qty Picking, TIDAK disimpan
     ke item.qtySisa) = SUM(qtyTersedia semua lot barang itu di
     DATA.batchStock) − SUM(qty yang SUDAH dialokasikan di baris
     item ini, item.batches[].qty). Direkalkulasi tiap kali batch
     ditambah/dihapus MAUPUN tiap kali Qty Picking berubah (walau
     Qty Picking sendiri tidak memengaruhi rumus Ready secara
     langsung — tetap dipanggil ulang dari handler yang sama demi
     kesederhanaan, sesuai instruksi).
   - Qty Sisa (item.qtySisa, kolom readonly) = untuk BATCH PERTAMA
     yang dialokasikan (item.batches[0], kalau ada): qtyTersedia
     lot itu (dicari balik di DATA.batchStock) dikurangi qty yang
     dialokasikan di batch pertama itu. Kalau belum ada batch
     dialokasikan sama sekali, qtySisa = 0. Ini interpretasi
     "sisa saldo lot itu setelah picking baris ini" — dipilih karena
     ini satu-satunya pembacaan yang bisa dibuat self-consistent dan
     mencerminkan perilaku WMS riil (Qty Sisa = stok lot yg tersisa
     di gudang setelah sebagian diambil untuk PL ini), sekaligus jadi
     satu-satunya cara supaya baris contoh index 0 (BRG-001/BRG-002)
     menghasilkan PERSIS Qty Sisa 20 & 80 seperti di screenshot.
========================================================= */
