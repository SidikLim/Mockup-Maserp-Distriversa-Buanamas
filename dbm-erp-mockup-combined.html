function pklGenerateNumber(cabang){
  const kode = PKL_CABANG_CODE[cabang] || 'XXX';
  const seq = DATA.pickingList.filter(r => r.cabang === cabang).length + 1;
  return `26/PKL/${kode}/08/${String(seq).padStart(5,'0')}`;
}

function pklBuildEmptyItem(){
  return { kode:'', nama:'', satuan:'', qtyOrder:0, qtyPicking:0, batches:[], qtySisa:0 };
}

/* ===== Kalkulasi reaktif per-baris (lihat penjelasan rumus lengkap di
   komentar header file ini) ===== */
function pklItemReady(item){
  const lots = DATA.batchStock[item.kode] || [];
  const totalTersedia = lots.reduce((s,l) => s + (+l.qtyTersedia || 0), 0);
  const totalAlokasi = (item.batches || []).reduce((s,b) => s + (+b.qty || 0), 0);
  return totalTersedia - totalAlokasi;
}

function pklRecalcItem(item){
  if(item.batches && item.batches.length){
    const first = item.batches[0];
    const lots = DATA.batchStock[item.kode] || [];
    const lot = lots.find(l => l.kode === first.kode);
    item.qtySisa = lot ? (lot.qtyTersedia - (+first.qty || 0)) : 0;
  } else {
    item.qtySisa = 0;
  }
}

function pklRefreshItemRowDOM(idx, item){
  const readyEl = document.getElementById(`pklReady${idx}`);
  if(readyEl) readyEl.textContent = `Ready: ${num(pklItemReady(item))}`;
  const sisaEl = document.querySelector(`[data-pkl-qtysisa="${idx}"]`);
  if(sisaEl) sisaEl.value = num(item.qtySisa || 0);
  const batchListEl = document.getElementById(`pklBatchList${idx}`);
  if(batchListEl) batchListEl.innerHTML = tplPklBatchAllocRows(item, idx, '');
  wirePklBatchDelButtons(idx, item);
}

/* Item yang datang dari picker "No. S.O." bawa 1 batch DEFAULT (dari
   noBatch/tglKadaluarsa yang tersimpan di baris item SO itu) dengan
   qty:0 & flag autoQty:true — flag ini bikin qty-nya OTOMATIS ikut
   nilai Qty Picking (lewat fungsi ini) SAMPAI user menambah/menghapus
   batch secara manual lewat picker "Pilih Batch" (begitu itu terjadi,
   item.batches berubah panjang/isi dan syarat "length===1 && autoQty"
   di bawah ini otomatis tidak terpenuhi lagi, jadi auto-sync berhenti
   dengan sendirinya, tanpa perlu flag tambahan untuk "matikan auto").
   Kode batch bawaan SO (noBatch) belum tentu ada di DATA.batchStock
   (lot itu independen/tidak selalu match), jadi qtySisa untuk kasus ini
   bisa jadi 0 kalau lot-nya tidak ditemukan — keterbatasan yang
   didokumentasikan, bukan bug: fokus utama rumus Qty Sisa yang presisi
   ada di baris sample yang memang dirancang manual (index 0). */
function pklSyncAutoBatchQty(item){
  if(item.batches && item.batches.length === 1 && item.batches[0].autoQty){
    item.batches[0].qty = +item.qtyPicking || 0;
  }
}

function openPklForm(mode, idx){
  let row;
  if(mode === 'add'){
    const cabang0 = PKL_CABANG_LIST[0];
    row = {
      no: null, prefix: PKL_PREFIX_LIST[0], tglBuat: '', cabang: cabang0,
      gudang: PKL_GUDANG_BY_CABANG[cabang0], area: PKL_AREA_BY_CABANG[cabang0] || '',
      customerKode:'', customerNama:'', customerAlamat:'',
      noSO:'', noSOKeterangan:'', tglSO:'',
      tglPicking:'11/08/2026', status:'Waiting Request Packing',
      picker:[], pickerChecker: DATA.pickerList[0], keterangan:'',
      items:[], tglInput:'', userInput:'', tglEdit:'', userEdit:'',
    };
    row.no = pklGenerateNumber(row.cabang);
  } else {
    const src = DATA.pickingList[idx];
    row = { ...src, picker: [...(src.picker||[])], items: src.items.map(it => ({ ...it, batches: (it.batches||[]).map(b => ({ ...b })) })) };
  }

  content.innerHTML = tplPklForm(mode, row);
  const isAdd = mode === 'add';

  document.getElementById('btnPklTutorial').onclick = () => openPklInfo('Tutorial', 'Video tutorial pengisian Picking List akan tersedia di sini.');

  if(isAdd){
    document.getElementById('fPklCabang').onchange = (e) => {
      row.cabang = e.target.value;
      row.area = PKL_AREA_BY_CABANG[row.cabang] || '';
      row.gudang = PKL_GUDANG_BY_CABANG[row.cabang] || PKL_GUDANG_LIST[0];
      row.no = pklGenerateNumber(row.cabang);
      document.getElementById('fPklArea').value = row.area;
      document.getElementById('fPklGudang').value = row.gudang;
      document.getElementById('fPklNo').value = row.no;
    };
    document.getElementById('pklRefreshNo').onclick = () => {
      row.no = pklGenerateNumber(document.getElementById('fPklCabang').value);
      document.getElementById('fPklNo').value = row.no;
    };
  }

  document.getElementById('pklSoSearch').onclick = () => openPklSoPicker(row);
  document.getElementById('pklAddPicker').onclick = (e) => { e.preventDefault(); openPklPickerAddModal(row); };
  renderPklPickerTags(row);

  wirePklItemEvents(row);
  document.getElementById('pklAddItem').onclick = (e) => {
    e.preventDefault();
    row.items.push(pklBuildEmptyItem());
    rerenderPklItemsTable(row);

function wirePklItemEvents(row){
  row.items.forEach((item, idx) => {
    const searchBtn = document.querySelector(`[data-pkl-item-search="${idx}"]`);
    const delBtn = document.querySelector(`[data-pkl-item-del="${idx}"]`);
    const qtyPickingEl = document.querySelector(`[data-pkl-qtypicking="${idx}"]`);
    const batchSearchBtn = document.querySelector(`[data-pkl-batch-search="${idx}"]`);

    if(searchBtn) searchBtn.onclick = () => openPklItemPicker(idx, row);
    if(delBtn) delBtn.onclick = () => {
      if(row.items.length <= 1){ pklValidationError('Minimal harus ada 1 baris barang'); return; }
      row.items.splice(idx, 1);
      rerenderPklItemsTable(row);
    };
    if(batchSearchBtn) batchSearchBtn.onclick = () => openPklBatchPicker(idx, row);
    if(qtyPickingEl) qtyPickingEl.onchange = () => {
      item.qtyPicking = +qtyPickingEl.value || 0;
      pklSyncAutoBatchQty(item);
      pklRecalcItem(item);
      pklRefreshItemRowDOM(idx, item);
    };

    wirePklBatchDelButtons(idx, item);
  });

  openPersediaanPicker(row.cabang, (persed) => {

    target.kode = persed.kodeBarang; target.nama = persed.namaBarang; target.satuan = persed.satuan;

function openPklBatchPicker(idx, row){
  closeModal();
  const item = row.items[idx];
  const lots = DATA.batchStock[item.kode] || [];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = tplPklBatchPicker(lots, idx);
  document.body.appendChild(overlay);
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  overlay.querySelectorAll('[data-pick-batch]').forEach(btn => btn.onclick = () => {
    const lot = lots.find(l => l.kode === btn.dataset.pickBatch);
    if(!lot) return;
    const sudahDialokasikan = (item.batches || []).reduce((s,b) => s + (+b.qty || 0), 0);
    const sisaDibutuhkan = Math.max(0, (+item.qtyPicking || 0) - sudahDialokasikan);
    const qty = Math.min(sisaDibutuhkan, lot.qtyTersedia);
    if(!item.batches) item.batches = [];
    item.batches.push({ kode: lot.kode, qty: qty, tglExpired: lot.tglExpired });
    pklRecalcItem(item);
    pklRefreshItemRowDOM(idx, item);
    closeModal();
  });
}

   ini pertama kali diklik — lihat PAGE_MODULES di js/core.js.
   Markup HTML-nya ada di file sebelah: promotion.template.js
   (tplPromotionListPage/tplPromRows/tplPromotionForm/
   tplPromotionFormBody/tplPromDiscountProgram/
   tplPromDiscountProposal/tplPromDiscountCategory/dst).
   NB: closeModal() dipakai bersama, didefinisikan di core.js.

   Pola CRUD: list + form FULL PAGE (sama seperti Master Supplier/
   Jurnal Pembelian/Stock Request/Purchase Order/Kategori Barang/
   Grup Customer). Bagian PALING KHAS modul ini: field "Promotion
   Category" adalah DRIVER — begitu diganti, SELURUH badan form
   (bukan cuma 1 sub-section seperti Grup Customer) di-render ulang
   lewat tplPromotionFormBody() sesuai kategori baru. Supaya field
   umum yang sudah diisi user (Nama, Tgl Awal/Akhir, Status, Tipe
   Customer, dst — semuanya IKUT ter-render ulang di tiap varian)
   tidak hilang saat kategori diganti, nilai-nilai itu dibaca dulu
   dari DOM (promSyncCommonFromDOM) SEBELUM badan form diganti,
   nilainya disimpan balik ke `row`, baru redraw dengan kategori
   baru — pola "baca state dari DOM sebelum render ulang" ini sama
   seperti renderCgLegalitasSections() di Grup Customer.
========================================================= */

const PROM_OUTLET_CODE = {'Head Office':'HO','Surabaya':'SBY','Bandung':'BDG','Medan':'MDN','Makassar':'MKS','Semarang':'SMG','Tangerang':'TGR','Sidoarjo':'SDA'};

/* Pastikan field spesifik-kategori ter-inisialisasi begitu Promotion
   Category diganti di form yang sedang terbuka — kalau baris sebelumnya
   sudah pernah punya struktur yang cocok (misal pindah DPF<->DPL yang
   struktur `items`-nya identik), datanya DIPERTAHANKAN, bukan direset. */
function promEnsureCategoryDefaults(row){
  if(row.kategori === 'A'){
    if(!row.detail || !Array.isArray(row.detail.items) || !row.detail.items.length){
      row.detail = { items:[promEmptyDpItem()] };
    }
  } else if(row.kategori === 'DPF' || row.kategori === 'DPL'){
    if(row.kuotaAktif === undefined) row.kuotaAktif = false;
    if(row.kuota === undefined) row.kuota = 0;
    if(row.isGuarantee === undefined) row.isGuarantee = false;
    if(row.janganUpdateHna === undefined) row.janganUpdateHna = false;
    if(row.subTotal === undefined) row.subTotal = 0;
    if(!Array.isArray(row.items) || !row.items.length || !('hna' in row.items[0])){
      row.items = [promEmptyDpfItem()];
    }
  } else if(row.kategori === 'CAT'){
    if(row.dayName === undefined) row.dayName = '';
    if(row.day === undefined) row.day = 1;
    if(row.jamBukaJam === undefined) row.jamBukaJam = 0;
    if(row.jamBukaMenit === undefined) row.jamBukaMenit = 0;
    if(row.jamTutupJam === undefined) row.jamTutupJam = 0;
    if(row.jamTutupMenit === undefined) row.jamTutupMenit = 0;
    if(row.minimalTransaksi === undefined) row.minimalTransaksi = 0;
    if(row.kuota === undefined) row.kuota = 0;
    if(!Array.isArray(row.items) || !row.items.length || !('kategoriKode' in row.items[0])){
      row.items = [promEmptyCatItem()];
    }
  }
}

function promCloneRow(src){
  const row = { ...src };
  if(src.detail){
    row.detail = { items: src.detail.items.map(it => ({ ...it, ketentuan: it.ketentuan.map(k => ({ ...k })) })) };
  }
  if(src.items){
    row.items = src.items.map(it => ({ ...it }));
  }
  return row;
}

function promValidationError(text){
  openPromInfo('Validasi', text);
}

/* =========================================================
   FORM UTAMA — dispatch ulang seluruh badan form tiap kali
   Promotion Category berganti.
========================================================= */
function openPromForm(mode, idx){
  const row = mode === 'add' ? promEmptyRow('A') : promCloneRow(DATA.promotion[idx]);
  if(mode === 'add'){
    row.kode = promGenerateNumber(row.outlet);
    promEnsureCategoryDefaults(row);
  }

  function renderBody(){
    content.innerHTML = tplPromotionForm(mode, row);
    wireHeader();
    wireCommonBlockFields();
    wireVariant();
    wireFooter();
  }

  function wireHeader(){
    if(mode === 'add'){
      const btn = document.getElementById('promRefreshKode');
      if(btn) btn.onclick = () => {
        row.kode = promGenerateNumber(row.outlet);
        document.getElementById('fPromKode').value = row.kode;
      };
    }
    document.getElementById('fPromKategori').onchange = (e) => {
      promSyncCommonFromDOM(row);
      row.kategori = e.target.value;
      promEnsureCategoryDefaults(row);
      renderBody();
    };
  }

  function wireCommonBlockFields(){
    document.getElementById('promTipeCustomerSearch').onclick = () => openPromTipeCustomerPicker(row);
    document.getElementById('promCustomerSearch').onclick = () => openPromCustomerPicker(row);
    document.getElementById('promGrupCustomerSearch').onclick = () => openPromGrupCustomerPicker(row);
    document.getElementById('promOutletSearch').onclick = () => openPromOutletPicker(row);
    document.getElementById('promPpnInfo').onclick = () => openPromInfo('PPN', `PPN yang berlaku untuk promotion ini saat ini: ${document.getElementById('fPromPpn').value}%.`);
  }

  function wireVariant(){
    if(row.kategori === 'A') wireDiscountProgram(row);
    else if(row.kategori === 'DPF' || row.kategori === 'DPL') wireDiscountProposal(row);
    else if(row.kategori === 'CAT') wireDiscountCategory(row);
  }

  function wireFooter(){
    document.getElementById('promCancel').onclick = (e) => { e.preventDefault(); renderPromList(); };
    document.getElementById('promSave').onclick = () => {
      promSyncCommonFromDOM(row);
      if(!row.nama){ promValidationError('Promotion Name wajib diisi'); return; }
      if(mode === 'add'){
        row.kode = row.kode || promGenerateNumber(row.outlet);
        DATA.promotion.push(row);
      } else {
        DATA.promotion[idx] = row;
      }
      renderPromList();
    };
  }

  renderBody();
}

/* Baca field-field yang SELALU ada di semua varian (header + common
   block) langsung dari DOM — dipanggil sebelum ganti kategori (supaya
   data yang sudah diisi user tidak hilang saat badan form diganti total)
   maupun sebelum Simpan. */
function promSyncCommonFromDOM(row){
  const kodeEl = document.getElementById('fPromKode'); if(kodeEl) row.kode = kodeEl.value.trim();
  const namaEl = document.getElementById('fPromNama'); if(namaEl) row.nama = namaEl.value.trim();
  const tglAwalEl = document.getElementById('fPromTglAwal'); if(tglAwalEl) row.tglAwal = tglAwalEl.value;
  const tglAkhirEl = document.getElementById('fPromTglAkhir'); if(tglAkhirEl) row.tglAkhir = tglAkhirEl.value;
  const statusEl = document.getElementById('fPromStatus'); if(statusEl) row.status = statusEl.value;
  const tcEl = document.getElementById('fPromTipeCustomer'); if(tcEl) row.tipeCustomer = tcEl.dataset.kode || row.tipeCustomer;
  const custEl = document.getElementById('fPromCustomer'); if(custEl) row.customer = custEl.value;
  const gcEl = document.getElementById('fPromGrupCustomer'); if(gcEl) row.grupCustomer = gcEl.dataset.kode || row.grupCustomer;
  const descEl = document.getElementById('fPromDescription'); if(descEl) row.description = descEl.value.trim();
  const outletEl = document.getElementById('fPromOutlet'); if(outletEl) row.outlet = outletEl.value;
  const ppnEl = document.getElementById('fPromPpn'); if(ppnEl) row.ppn = +ppnEl.value || 0;
  const klEl = document.getElementById('fPromKodeLock'); if(klEl) row.kodeLock = klEl.value;
}

/* Sub Total reaktif: qty * HNA1 dikurangi Discount Principal/Distributor/
   Support Discount — kalau unit '%' dihitung persentase dari HNA1, kalau
   'Rp' diperlakukan sebagai potongan flat per unit (dikali qty). Simplifikasi
   wajar untuk mockup (formula per screenshot tidak dijelaskan detail; disini
   diseragamkan 1 formula konsisten untuk ketiga jenis diskon). */
function promRecalcSubTotal(row){
  row.subTotal = Math.round(row.items.reduce((sum, it) => {
    const qty = +it.qty || 0;
    const hna1 = +it.hna1 || 0;
    let net = hna1;
    net -= (it.discPrincipalUnit === '%') ? (hna1 * (+it.discPrincipal || 0) / 100) : (+it.discPrincipal || 0);
    net -= (it.discDistributorUnit === '%') ? (hna1 * (+it.discDistributor || 0) / 100) : (+it.discDistributor || 0);
    net -= (it.supportDiscountUnit === '%') ? (hna1 * (+it.supportDiscount || 0) / 100) : (+it.supportDiscount || 0);
    return sum + qty * net;
  }, 0));
}

function promRefreshSubTotalDOM(row){
  const el = document.getElementById('fPromSubTotal');
  if(el) el.value = num(row.subTotal || 0);
}

   Daftar Transaksi). Dimuat otomatis (lazy-load) oleh core.js
   saat menu ini pertama kali diklik — lihat PAGE_MODULES di
   js/core.js. Markup HTML-nya ada di file sebelah:
   purchase-order.template.js (tplPurchaseOrderListPage/tplPoRows/

   yang dipakai bersama di sini).
   NB: closeModal() dipakai bersama, didefinisikan di core.js.

   Pola CRUD: list + form FULL PAGE (sama seperti Jurnal Pembelian/
   Stock Request), dengan tambahan: tabel rincian barang yang
   kolom-kolom kalkulasinya (Total Disc%, Disc/Barang, Jumlah) dan
   panel "Rincian Transaksi" (DPP/PPN/PPh/Jumlah) re-kalkulasi

const PO_CABANG_CODE = {'Head Office':'HO','Surabaya':'SBY','Bandung':'BDG','Medan':'MDN','Makassar':'MKS','Semarang':'SMG','Tangerang':'TGR','Sidoarjo':'SDA'};

}

function poRecalcItem(item){
  item.totalDisc = (+item.feeDistribusi || 0) + (+item.budgetDiskon || 0);
  item.discBarang = Math.round((+item.hargaBeli || 0) * (+item.qty || 0) * item.totalDisc / 100);
  item.jumlah = Math.round((+item.hargaBeli || 0) * (+item.qty || 0) - item.discBarang);
}

/* Rekalkulasi total DPP/Diskon/PPN/PPh/Jumlah Akhir. Mode PPN
   "Tidak ada PPN"/"PPN Tidak Dipungut Pajak" disederhanakan jadi
   ppnAmount=0 (tanpa ekstraksi PPN-inklusif dari harga) — simplifikasi
   wajar untuk mockup, konsisten dengan penyederhanaan field cascading
   region di form Master Supplier. */
function poRecalcTotals(row){
  row.dpp = row.items.reduce((s,it) => s + (+it.jumlah || 0), 0);
  row.diskon1Amount = Math.round(row.dpp * (+row.diskon1 || 0) / 100);
  row.diskon2Amount = Math.round(row.dpp * (+row.diskon2 || 0) / 100);
  row.ppnAmount = (row.ppnMode === 'eksklusif') ? Math.round(row.dpp * 0.11) : 0;
  row.pajak11 = (row.ppnMode === 'eksklusif' || row.ppnMode === 'inklusif') ? 'PPN11' : '';
  row.pphAmount = row.pphAktif ? Math.round(row.dpp * (+row.pphPersen || 0) / 100) : 0;
  row.jumlahTotal = Math.round(row.dpp - row.diskon1Amount - row.diskon2Amount + row.ppnAmount - row.pphAmount + (+row.ongkosAngkut || 0));
}

function wirePoItemEvents(row){
  row.items.forEach((item, idx) => {
    const kodeInput = document.querySelector(`[data-po-kode="${idx}"]`);
    const searchBtn = document.querySelector(`[data-po-item-search="${idx}"]`);
    const delBtn = document.querySelector(`[data-po-item-del="${idx}"]`);
    const pphCb = document.querySelector(`[data-po-pph="${idx}"]`);
    const namaEl = document.querySelector(`[data-po-nama="${idx}"]`);
    const qtyEl = document.querySelector(`[data-po-qty="${idx}"]`);
    const hargaEl = document.querySelector(`[data-po-harga="${idx}"]`);
    const feeEl = document.querySelector(`[data-po-fee="${idx}"]`);
    const budgetEl = document.querySelector(`[data-po-budget="${idx}"]`);

    if(searchBtn) searchBtn.onclick = () => openPoItemPicker(idx, row);
    if(delBtn) delBtn.onclick = () => {
      if(row.items.length <= 1){ poValidationError('Minimal harus ada 1 baris barang'); return; }
      row.items.splice(idx, 1);
      rerenderPoItemsTable(row);
    };
    if(pphCb) pphCb.onchange = () => { item.pph = pphCb.checked; };
    if(namaEl) namaEl.onchange = () => { item.nama = namaEl.value; };
    [qtyEl, hargaEl, feeEl, budgetEl].forEach(el => {
      if(!el) return;
      el.onchange = () => {
        item.qty = qtyEl ? (+qtyEl.value || 0) : item.qty;
        item.hargaBeli = hargaEl ? (+hargaEl.value || 0) : item.hargaBeli;
        item.feeDistribusi = feeEl ? (+feeEl.value || 0) : item.feeDistribusi;
        item.budgetDiskon = budgetEl ? (+budgetEl.value || 0) : item.budgetDiskon;
        poRecalcItem(item);
        poRefreshItemRowDOM(idx, item);
        poRecalcTotals(row);
        poRefreshTotalsDOM(row);
      };
    });
  });
}

function soGenerateNumber(sOffice){

  return `26/SO/${kode}/08/${String(seq).padStart(5,'0')}`;

function soBuildEmptyItem(){
  return { kode:'', nama:'', qty:1, um:'', hna1:0, hnaXqty:0, potongan:0, dpp:0, typePpn:DATA.typePpnList[0], ppn:0, biayaKirim:0, noBatch:'', tglKadaluarsa:'' };
}

/* Kalkulasi murni 1 baris item — TIDAK menyentuh DOM (dipanggil oleh
   wireSoItemEvents/openSoItemPicker, tampilannya di-refresh terpisah
   lewat soRefreshItemRowDOM). Potongan didefinisikan sebagai NOMINAL
   Rupiah (bukan persen) — sesuai rumus "DPP = HNA1 x Qty − Potongan".
   PPN: hanya mode 'PPN 11%' yang benar-benar dihitung (11% dari DPP);
   mode 'PPN 12%'/'Non PKP' disederhanakan jadi 0 — pola simplifikasi
   yang sama seperti poRecalcTotals() di Purchase Order (mode PPN
   "Tidak ada"/"Tidak Dipungut" -> ppnAmount 0 tanpa ekstraksi lebih
   jauh), supaya mockup tidak perlu simulasi tabel pajak lengkap. */
function soRecalcItem(item){
  item.hnaXqty = Math.round((+item.hna1 || 0) * (+item.qty || 0));
  item.dpp = Math.max(0, item.hnaXqty - (+item.potongan || 0));
  item.ppn = (item.typePpn === 'PPN 11%') ? Math.round(item.dpp * 0.11) : 0;
}

function soRefreshItemRowDOM(idx, item){
  const hnaXqtyEl = document.querySelector(`[data-so-hnaxqty="${idx}"]`);
  const dppEl = document.querySelector(`[data-so-dpp="${idx}"]`);
  const ppnEl = document.querySelector(`[data-so-ppn="${idx}"]`);
  if(hnaXqtyEl) hnaXqtyEl.value = num(item.hnaXqty);
  if(dppEl) dppEl.value = num(item.dpp);
  if(ppnEl) ppnEl.value = num(item.ppn);
}

/* Total dokumen — Biaya Kirim didefinisikan per-baris (kolom di tabel
   item) lalu dijumlah ke Total Biaya Kirim dokumen, konsisten dengan
   Ongkos Angkut di Purchase Order yang juga masuk ke Jumlah Akhir. */
function soRecalcTotals(row){
  row.totalDpp = row.items.reduce((s,it) => s + (+it.dpp || 0), 0);
  row.totalPpn = row.items.reduce((s,it) => s + (+it.ppn || 0), 0);
  row.totalBiayaKirim = row.items.reduce((s,it) => s + (+it.biayaKirim || 0), 0);
  row.jumlahAkhir = row.totalDpp + row.totalPpn + row.totalBiayaKirim;
}

function soRefreshTotalsDOM(row){
  document.getElementById('fSoTotalDpp').value = num(row.totalDpp);
  document.getElementById('fSoTotalPpn').value = num(row.totalPpn);
  document.getElementById('fSoTotalBiayaKirim').value = num(row.totalBiayaKirim);
  document.getElementById('fSoJumlahAkhir').value = num(row.jumlahAkhir);
}

/* CL/Piutang/Sisa CL — dihitung ulang begitu Customer diganti (bukan
   nunggu tombol Simpan), mengikuti pola split "kalkulasi murni vs
   update DOM" yang sama seperti item barang & total dokumen. */
function soRecalcCustomerFinance(row, customer){
  row.cl = customer ? (+customer.limit || 0) : 0;
  row.piutang = customer ? (+customer.piutang || 0) : 0;
  row.sisaCl = row.cl - row.piutang;
}

function soRefreshCustomerFinanceDOM(row){
  document.getElementById('fSoCl').value = num(row.cl);
  document.getElementById('fSoPiutang').value = num(row.piutang);
  document.getElementById('fSoSisaCl').value = num(row.sisaCl);
}

    row.ukuranBasis = document.querySelector('input[name="fSoUkuranBasis"]:checked').value;
    row.items = validItems;

      row.no = soGenerateNumber(row.sOffice);

  soRefreshTotalsDOM(row);

function wireSoItemEvents(row){
  row.items.forEach((item, idx) => {
    const searchBtn = document.querySelector(`[data-so-item-search="${idx}"]`);
    const delBtn = document.querySelector(`[data-so-item-del="${idx}"]`);
    const namaEl = document.querySelector(`[data-so-nama="${idx}"]`);
    const qtyEl = document.querySelector(`[data-so-qty="${idx}"]`);
    const hna1El = document.querySelector(`[data-so-hna1="${idx}"]`);
    const potonganEl = document.querySelector(`[data-so-potongan="${idx}"]`);
    const typePpnEl = document.querySelector(`[data-so-typeppn="${idx}"]`);
    const biayaKirimEl = document.querySelector(`[data-so-biayakirim="${idx}"]`);
    const batchEl = document.querySelector(`[data-so-batch="${idx}"]`);
    const edEl = document.querySelector(`[data-so-ed="${idx}"]`);

    if(searchBtn) searchBtn.onclick = () => openSoItemPicker(idx, row);
    if(delBtn) delBtn.onclick = () => {
      if(row.items.length <= 1){ soValidationError('Minimal harus ada 1 baris barang'); return; }
      row.items.splice(idx, 1);
      rerenderSoItemsTable(row);
    };
    if(namaEl) namaEl.onchange = () => { item.nama = namaEl.value; };
    if(batchEl) batchEl.onchange = () => { item.noBatch = batchEl.value; };
    if(edEl) edEl.onchange = () => { item.tglKadaluarsa = edEl.value; };

    const recalcRow = () => {
      item.qty = qtyEl ? (+qtyEl.value || 0) : item.qty;
      item.hna1 = hna1El ? (+hna1El.value || 0) : item.hna1;
      item.potongan = potonganEl ? (+potonganEl.value || 0) : item.potongan;
      item.typePpn = typePpnEl ? typePpnEl.value : item.typePpn;
      item.biayaKirim = biayaKirimEl ? (+biayaKirimEl.value || 0) : item.biayaKirim;
      soRecalcItem(item);
      soRefreshItemRowDOM(idx, item);
      soRecalcTotals(row);
      soRefreshTotalsDOM(row);
    };
    [qtyEl, hna1El, potonganEl, typePpnEl, biayaKirimEl].forEach(el => {
      if(!el) return;
      const evt = (el.tagName === 'SELECT') ? 'onchange' : 'onchange';
      el[evt] = recalcRow;
      // Biaya Kirim tidak mempengaruhi DPP/PPN baris, tapi tetap perlu
      // memicu re-total dokumen segera (reaktif), makanya tetap masuk
      // ke recalcRow yang sama.
    });
  });
}

function srGenerateNumber(cabang){

  return `26/SR/${kode}/08/${String(seq).padStart(5,'0')}`;

  return DATA.items.map(it => ({ kode: it.kode, nama: it.nama, kategori: it.kategori, qtyReordering: 0, pilih: false, qty: 0, um: it.satuan }));

function openSrForm(mode, idx){
  let row;
  if(mode === 'add'){
    row = {
      no: null, noPO: '', tglRequest: '07/08/2026', userEntry: 'sidik', reorderingSheet: '', tipeTransaksi: 'Transfer Out',
      keterangan: '', status: 'OPEN', closedManually: false, cabangRequest: SR_CABANG_LIST[0], supplier: '',
      gudangSumber: SR_GUDANG_LIST[0], gudangTarget: SR_GUDANG_LIST[0], edBulan: 0, usedInPO: false,
      items: srBuildDefaultItems(), tglInput: '', userInput: '', tglEdit: '', userEdit: '',
    };
    row.no = srGenerateNumber(row.cabangRequest);
  } else {
    const src = DATA.stockRequest[idx];
    row = { ...src, items: src.items.map(it => ({ ...it })) };
  }

  let groups = srGroupItemsByKategori(row.items);
  content.innerHTML = tplStockRequestForm(mode, row, groups);
  wireSrGroupCollapse();

  if(mode === 'view'){
    document.getElementById('srTutup').onclick = (e) => { e.preventDefault(); renderSrList(); };
    return;
  }

  wireSrItemInputs(groups);

  if(mode === 'add'){
    document.getElementById('fSrCabang').onchange = (e) => {
      row.cabangRequest = e.target.value;
      row.no = srGenerateNumber(row.cabangRequest);
      document.getElementById('fSrNo').value = row.no;
    };
    document.getElementById('srRefreshNo').onclick = () => {
      row.no = srGenerateNumber(document.getElementById('fSrCabang').value);
      document.getElementById('fSrNo').value = row.no;
    };
  }

  document.getElementById('srRosSearch').onclick = () => openSrRosPicker(row);

  document.getElementById('srBatalkan').onclick = (e) => { e.preventDefault(); renderSrList(); };

  document.getElementById('srSimpan').onclick = () => {
    const selectedItems = [];
    groups.forEach(g => g.items.forEach(it => { if(it.pilih && it.qty > 0) selectedItems.push(it); }));

    row.supplier = document.getElementById('fSrSupplier').value;
    row.tglRequest = document.getElementById('fSrTgl').value;
    row.gudangSumber = document.getElementById('fSrGudangSumber').value;
    row.gudangTarget = document.getElementById('fSrGudangTarget').value;
    row.edBulan = +document.getElementById('fSrEd').value || 0;
    row.keterangan = document.getElementById('fSrKeterangan').value;
    row.items = selectedItems;

    if(mode === 'add'){
      row.cabangRequest = document.getElementById('fSrCabang').value;
      row.no = srGenerateNumber(row.cabangRequest);
      row.tglInput = row.tglRequest + ' ' + new Date().toTimeString().slice(0,8);
      row.userInput = 'sidik';
      DATA.stockRequest.push(row);
    } else {
      row.tglEdit = row.tglRequest + ' ' + new Date().toTimeString().slice(0,8);
      row.userEdit = 'sidik';
      DATA.stockRequest[idx] = row;
    }
    renderSrList();
  };
}

/* Wiring checkbox "Pilih" per baris + checkbox "Pilih Semua" per
   grup + input Qty (enable/disable ikut status checkbox). */
function wireSrItemInputs(groups){
  groups.forEach((g, gi) => {
    document.querySelectorAll(`[data-sr-pilih^="${gi}:"]`).forEach(cb => {
      cb.onchange = () => {
        const ii = +cb.dataset.srPilih.split(':')[1];
        g.items[ii].pilih = cb.checked;
        const qtyInput = document.querySelector(`[data-sr-qty="${gi}:${ii}"]`);
        qtyInput.disabled = !cb.checked;
        if(cb.checked && (+qtyInput.value) === 0 && g.items[ii].qtyReordering > 0){
          qtyInput.value = g.items[ii].qtyReordering;
          g.items[ii].qty = g.items[ii].qtyReordering;
        }
        syncSrGroupCheckAll(gi, g);
      };
    });
    document.querySelectorAll(`[data-sr-qty^="${gi}:"]`).forEach(inp => {
      inp.onchange = () => {
        const ii = +inp.dataset.srQty.split(':')[1];
        g.items[ii].qty = +inp.value || 0;
      };
    });
    const checkAll = document.querySelector(`[data-group-check-all="${gi}"]`);
    if(checkAll){
      checkAll.onchange = () => {
        g.items.forEach((it, ii) => {
          it.pilih = checkAll.checked;
          const cb = document.querySelector(`[data-sr-pilih="${gi}:${ii}"]`);
          const qtyInput = document.querySelector(`[data-sr-qty="${gi}:${ii}"]`);
          if(cb) cb.checked = checkAll.checked;
          if(qtyInput){
            qtyInput.disabled = !checkAll.checked;
            if(checkAll.checked && (+qtyInput.value) === 0 && it.qtyReordering > 0){
              qtyInput.value = it.qtyReordering;
              it.qty = it.qtyReordering;
            }
          }
        });
      };
    }
  });
}

function syncSrGroupCheckAll(gi, g){
  const checkAll = document.querySelector(`[data-group-check-all="${gi}"]`);
  if(checkAll) checkAll.checked = g.items.every(it => it.pilih);
}

function wireSrGroupCollapse(){
  document.querySelectorAll('[data-group-toggle]').forEach(bar => {
    bar.onclick = () => {
      const gi = bar.dataset.groupToggle;
      bar.classList.toggle('open');
      document.getElementById(`srGroupBody${gi}`).classList.toggle('open');
    };
  });
}

<script>
/* =========================================================
   CORE — sidebar, navigasi, dan lazy-loader modul per menu

   File ini SENGAJA dibuat kecil dan selalu dimuat di awal
   (bareng icons.js/data.js/menu.js). Kode tiap dashboard/

const sidebarScroll=document.getElementById('sidebarScroll');

function buildSidebar(){

      sub.className='submenu'+(top.open?' open':'');
      top.children.forEach(c=>{
        if(c.header){
          const h=document.createElement('div');
          h.className='submenu-header';
          h.textContent=c.header;
          sub.appendChild(h);
        }else{
          const it=document.createElement('div');
          it.className='submenu-item';
          it.innerHTML=`<span class="dot"></span><span>${c.label}</span>`;
          it.onclick=()=>{
            navigate(c.page, c.title||c.label, it);
            document.querySelectorAll('.menu-top').forEach(m=>m.classList.remove('active-parent'));
            if(top.page) head.classList.add('active-parent');
          };
          sub.appendChild(it);
        }
      });
      head.onclick=()=>{
        const willOpen=!head.classList.contains('open');
        document.querySelectorAll('.menu-top').forEach(m=>m.classList.remove('open'));
        document.querySelectorAll('.submenu').forEach(m=>m.classList.remove('open'));
        if(willOpen){ head.classList.add('open'); sub.classList.add('open'); }
        if(top.page){ navigate(top.page, top.label, head, true); }
      };
      wrap.appendChild(head); wrap.appendChild(sub);
      sidebarScroll.appendChild(wrap);
    }else{
      const leaf=document.createElement('div');
      leaf.className='menu-top leaf';
      leaf.innerHTML=`${icon(top.icon)}<span>${top.label}</span>`;
      leaf.onclick=()=>{
        document.querySelectorAll('.menu-top').forEach(m=>m.classList.remove('open','active-parent'));
        document.querySelectorAll('.submenu').forEach(m=>m.classList.remove('open'));
        navigate(top.page, top.label, leaf);
      };
      sidebarScroll.appendChild(leaf);
    }
  });
}

function navigate(page,title,el,isParent){
  currentPage=page; currentTitle=title;
  document.querySelectorAll('.submenu-item, .menu-top.leaf').forEach(x=>x.classList.remove('current'));
  if(isParent){
    document.querySelectorAll('.menu-top').forEach(m=>m.classList.remove('active-parent'));
    if(el) el.classList.add('active-parent');
  }else if(el){
    el.classList.add('current');
  }
  renderPage();
}

/* =========================================================
   LAZY-LOAD MODUL PER MENU
   Tiap entry = {srcs, fn}. `srcs` adalah DAFTAR file JS yang
   harus dimuat berurutan untuk menu itu — selalu 2 file:
   1) file *.template.js  → HANYA berisi markup HTML (fungsi
      tpl...() yang mengembalikan string HTML, tanpa logic).
   2) file logic-nya (nama sama tanpa ".template") → berisi
      fungsi render...() yang memanggil tpl...() lalu mengurus
      DOM-binding/event/chart/data — TANPA markup HTML mentah.
   `fn` = nama fungsi render yang dipanggil setelah kedua file
   itu selesai dimuat.
   Sekali dimuat, key menunya disimpan di `loadedModules`
   supaya klik berikutnya ke menu yang sama tidak fetch ulang.
========================================================= */

const loadedModules=new Set(Object.keys(PAGE_MODULES));

function loadScriptsSequential(srcs, onDone){
  let i=0;
  function next(){
    if(i>=srcs.length) return onDone();
    const src=srcs[i];
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>{ i++; next(); };
    s.onerror=()=>{
      content.innerHTML=`<div class="card"><div class="card-body">Gagal memuat modul <code>${src}</code>.</div></div>`;
    };
    document.body.appendChild(s);
  }
  next();
}

const content=document.getElementById('content');

function renderPage(){
  destroyCharts();
  if(currentPage==='placeholder') return renderPlaceholder(currentTitle);

  if(mod){

    return loadScriptsSequential(mod.srcs, ()=>{ loadedModules.add(currentPage); window[mod.fn](); });
  }

  const pages={
    customers:{title:'Customer', cols:[['kode','Kode'],['nama','Nama Customer'],['kota','Kota'],['salesman','Salesman'],['limit','Limit Kredit',true],['status','Status','pill']], rows:DATA.customers},
    salesman:{title:'Salesman', cols:[['nama','Nama Salesman'],['area','Area'],['target','Target',true],['realisasi','Realisasi',true]], rows:DATA.salesman},
    packing:{title:'Packing', cols:[['no','No. Packing'],['tgl','Tanggal'],['so','No. SO'],['status','Status','pill']], rows:DATA.packing},
    penerimaanPiutang:{title:'Penerimaan Piutang', cols:[['no','No. Penerimaan'],['tgl','Tanggal'],['customer','Customer'],['jumlah','Jumlah',true],['metode','Metode']], rows:DATA.penerimaanPiutang},
    items:{title:'Daftar Barang', cols:[['kode','Kode'],['nama','Nama Barang'],['kategori','Kategori'],['satuan','Satuan'],['stok','Stok','num'],['harga','Harga',true]], rows:DATA.items},
    kasMasuk:{title:'Kas Masuk', cols:[['tgl','Tanggal'],['ket','Keterangan'],['kategori','Kategori'],['jumlah','Jumlah',true]], rows:DATA.kasMasuk},
    kasKeluar:{title:'Kas Keluar', cols:[['tgl','Tanggal'],['ket','Keterangan'],['kategori','Kategori'],['jumlah','Jumlah',true]], rows:DATA.kasKeluar},
    transaksiKas:{title:'Transaksi Kas', cols:[['tgl','Tanggal'],['ket','Keterangan'],['tipe','Tipe','pill'],['kategori','Kategori'],['jumlah','Jumlah',true]], rows:DATA.transaksiKas},
    jurnalUmum:{title:'Jurnal Umum', cols:[['tgl','Tanggal'],['no','No. Jurnal'],['akun','Akun'],['debit','Debit',true],['kredit','Kredit',true]], rows:DATA.jurnalUmum},
    aktivaTetap:{title:'Daftar Aktiva Tetap', cols:[['kode','Kode'],['nama','Nama Aktiva'],['tahun','Tahun'],['nilai','Nilai Perolehan',true],['akumulasi','Akum. Penyusutan',true],['buku','Nilai Buku',true]], rows:DATA.aktivaTetap},

  };

function fmtCell(val,type){
  if(type==='num') return Number.isFinite(val)? num(val) : val;
  if(type===true) return Number.isFinite(val)? rp(val) : val;
  if(type==='pill'){
    const v=String(val).toLowerCase();
    let cls='status-open';
    if(v==='aktif'||v==='paid'||v==='closed'||v==='selesai'||v==='masuk') cls='status-paid';
    else if(v==='non aktif'||v==='overdue'||v==='keluar') cls='status-overdue';
    return `<span class="status-pill ${cls}">${val}</span>`;
  }
  return val;
}

/* =========================================================
   PICKER "DAFTAR PERSEDIAAN" (dipakai bersama oleh SEMUA modul
   transaksi yang punya field "Kode Barang": Purchase Order, Sales
   Order, Picking List, Faktur Penjualan Via S.J. — sejak 2026-08-12
   lanjutan lagi, menggantikan popup "Pilih Barang" versi lama yang
   cuma tampil Kode/Nama/Harga per modul (tplPoItemPicker/
   tplSoItemPicker/tplPklItemPicker/tplFktItemPicker — SUDAH DIHAPUS,
   lihat catatan proyek). Ditaruh di core.js (BUKAN di salah satu
   js/pages/*.js) karena dipakai lintas-modul & core.js selalu
   dimuat di awal, jadi otomatis tersedia untuk semua modul tanpa
   perlu di-lazy-load ulang.

   Sumber data: DATA.persediaan (lihat komentar lengkap di js/data.js)
   — 1 baris per kombinasi Gudang Utama x Barang. Dipanggil dari modul
   manapun cukup lewat 1 fungsi: openPersediaanPicker(cabang, onPick).
   `cabang` dipakai untuk filter baris persediaan supaya modal hanya
   menampilkan stok di Gudang Utama milik cabang transaksi yang sedang
   dibuka (kalau cabang belum match apa pun di DATA.persediaan, modal
   fallback menampilkan SEMUA baris supaya tetap ada isi). `onPick`
   dipanggil dengan 1 argumen (baris DATA.persediaan yang diklik) begitu
   user klik teks biru Kode Barang ATAU Nama Barang — pemanggil (modul
   transaksi) yang bertanggung jawab memetakan field persediaan itu ke
   bentuk item row modulnya sendiri (kode/nama/um/harga, dst berbeda-
   beda tiap modul) & memanggil recalc/rerender modulnya sendiri.

   Pencarian & pagination di modal ini SUNGGUHAN (bukan dekoratif) —
   pertama kalinya di mockup ini paginasi benar-benar berfungsi, karena
   DATA.persediaan per-cabang bisa lebih dari `pageSize` baris (10 baris
   per cabang, default 5 baris/halaman = 2 halaman, meniru pager
   First/Previous/1/2/Next/Last di screenshot MASERP). Dropdown ke-2 di
   toolbar ("Global Search") SENGAJA dekoratif (cuma visual, meniru
   dropdown pemilih kolom pencarian di screenshot) — pencarian sungguhan
   tetap mencari lewat SEMUA kolom teks (Kode Barang/Nama Barang/Nama
   Gudang) via 1 input teks, supaya tidak menambah kompleksitas UI tanpa
   manfaat nyata di mockup. Tombol "+" SENGAJA dekoratif (buka modal info
   singkat) karena menambah barang baru ke master Persediaan ada di luar
   scope popup pemilihan barang ini.
========================================================= */
let pspState = { rows:[], search:'', page:1, pageSize:5, onPick:null };

function openPersediaanPicker(cabang, onPick){
  closeModal();
  let rows = DATA.persediaan.filter(r => r.cabang === cabang);
  if(!rows.length) rows = DATA.persediaan;
  pspState = { rows, search:'', page:1, pageSize:5, onPick };
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = tplPersediaanPickerModal();
  document.body.appendChild(overlay);
  document.getElementById('modalClose').onclick = closeModal;
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  document.getElementById('pspAddBtn').onclick = () => openPspAddInfo();
  document.getElementById('pspPageSize').onchange = (e) => {
    pspState.pageSize = +e.target.value; pspState.page = 1; pspRenderTable();
  };
  document.getElementById('pspSearch').oninput = (e) => {
    pspState.search = e.target.value; pspState.page = 1; pspRenderTable();
  };
  pspRenderTable();
}

function pspFiltered(){
  const q = pspState.search.trim().toLowerCase();
  if(!q) return pspState.rows;
  return pspState.rows.filter(r =>
    r.kodeBarang.toLowerCase().includes(q) ||
    r.namaBarang.toLowerCase().includes(q) ||
    r.namaGudang.toLowerCase().includes(q));
}

function pspRenderTable(){
  const filtered = pspFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / pspState.pageSize));
  if(pspState.page > totalPages) pspState.page = totalPages;
  const startIdx = (pspState.page - 1) * pspState.pageSize;
  const pageRows = filtered.slice(startIdx, startIdx + pspState.pageSize);
  document.getElementById('pspBody').innerHTML = tplPersediaanPickerRows(pageRows);
  document.getElementById('pspTotal').textContent = `Total Record: ${filtered.length}`;
  document.getElementById('pspPagerWrap').innerHTML = tplPersediaanPager(pspState.page, totalPages);
  document.querySelectorAll('[data-psp-pick]').forEach(el => el.onclick = () => {
    const row = pspState.rows.find(r => r.kodeGudang === el.dataset.pspGudang && r.kodeBarang === el.dataset.pspPick);
    if(row && pspState.onPick) pspState.onPick(row);
    closeModal();
  });
  const pagerBtns = document.getElementById('pspPagerWrap');
  pagerBtns.querySelector('[data-psp-first]').onclick = () => { pspState.page = 1; pspRenderTable(); };
  pagerBtns.querySelector('[data-psp-prev]').onclick = () => { pspState.page = Math.max(1, pspState.page - 1); pspRenderTable(); };
  pagerBtns.querySelector('[data-psp-next]').onclick = () => { pspState.page = Math.min(totalPages, pspState.page + 1); pspRenderTable(); };
  pagerBtns.querySelector('[data-psp-last]').onclick = () => { pspState.page = totalPages; pspRenderTable(); };
  pagerBtns.querySelectorAll('[data-psp-page]').forEach(b => b.onclick = () => { pspState.page = +b.dataset.pspPage; pspRenderTable(); });
}

function tplPersediaanPickerRows(rows){
  if(!rows.length) return `<tr><td colspan="10" style="color:var(--text-light);">Tidak ada barang ditemukan</td></tr>`;
  return rows.map(r => `
    <tr>

      <td><button class="link-pick" data-psp-pick="${r.kodeBarang}" data-psp-gudang="${r.kodeGudang}">${r.namaBarang}</button></td>

      <td>${r.qtyBoPo}</td>
      <td>${r.qtyAvailable}</td>
      <td>${r.satuan}</td>
      <td>${r.konsinyasi}</td>
    </tr>`).join('');
}

function tplPersediaanPager(page, totalPages){
  let nums = '';
  for(let p = 1; p <= totalPages; p++){
    nums += `<button class="${p===page?'active':''}" data-psp-page="${p}">${p}</button>`;
  }
  return `<div class="pager">
    <button data-psp-first>First</button>
    <button data-psp-prev>Previous</button>
    ${nums}
    <button data-psp-next>Next</button>
    <button data-psp-last>Last</button>
  </div>`;
}
